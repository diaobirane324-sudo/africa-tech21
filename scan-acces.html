<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Carte Membre | AFRICA.TECH21</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Exo 2',sans-serif; }
:root {
  --cyan:#00f0ff; --green:#00ff88; --red:#ff0033;
  --purple:#7b2cbf; --gold:#ffd700;
  --dark:#050510; --panel:#0a0a1a;
  --border:rgba(0,240,255,0.25); --glow:0 0 25px rgba(0,240,255,0.3);
  --text:#fff; --text2:#a0a8c0;
}
body {
  background:
    radial-gradient(circle at 20% 20%, rgba(0,240,255,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(123,44,191,0.1) 0%, transparent 50%),
    linear-gradient(135deg,#050510,#0a0a1a 50%,#0f0f1f);
  color:var(--text); min-height:100vh; padding:1.5rem;
  display:flex; align-items:center; justify-content:center;
}
.hologram-grid {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:
    linear-gradient(90deg, rgba(0,240,255,0.02) 1px, transparent 1px),
    linear-gradient(180deg, rgba(0,240,255,0.02) 1px, transparent 1px);
  background-size:40px 40px; animation:gridScan 25s linear infinite;
  pointer-events:none; z-index:-1;
}
@keyframes gridScan { 0%{transform:translate(0,0);} 100%{transform:translate(40px,40px);} }
.container { max-width:600px; width:100%; }
.page-header {
  background:linear-gradient(135deg, rgba(0,240,255,0.08), rgba(123,44,191,0.08));
  backdrop-filter:blur(15px); border:1px solid var(--border);
  border-radius:22px; padding:2rem; margin-bottom:1.5rem; text-align:center;
  box-shadow:var(--glow);
}
.page-header h1 {
  font-family:'Orbitron',sans-serif; font-size:1.8rem;
  background:linear-gradient(45deg,var(--gold),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; letter-spacing:2px;
  margin-bottom:0.4rem;
}
.page-header .subtitle { color:var(--text2); font-size:0.85rem; letter-spacing:1.5px; text-transform:uppercase; }
.card-box {
  background:linear-gradient(135deg, rgba(16,16,40,0.85), rgba(10,10,26,0.85));
  backdrop-filter:blur(15px); border:1px solid var(--border);
  border-radius:18px; padding:1.5rem; margin-bottom:1.5rem;
}
.camera-container {
  position:relative; width:100%;
  border-radius:15px; overflow:hidden;
  background:#000; aspect-ratio:1/1;
  border:2px solid var(--border);
  margin-bottom:1rem;
}
#video {
  width:100%; height:100%; object-fit:cover;
  display:block;
}
.scan-overlay {
  position:absolute; inset:0;
  pointer-events:none;
}
.scan-frame {
  position:absolute; top:15%; left:15%; right:15%; bottom:15%;
  border:3px solid var(--cyan);
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,240,255,0.6), inset 0 0 30px rgba(0,240,255,0.2);
  animation:pulseFrame 1.5s infinite;
}
@keyframes pulseFrame {
  0%,100% { box-shadow:0 0 30px rgba(0,240,255,0.6), inset 0 0 30px rgba(0,240,255,0.2); }
  50% { box-shadow:0 0 50px rgba(0,240,255,1), inset 0 0 50px rgba(0,240,255,0.4); }
}
.scan-frame::before {
  content:''; position:absolute; top:-3px; left:-3px;
  width:40px; height:40px;
  border-top:5px solid var(--green); border-left:5px solid var(--green);
  border-radius:15px 0 0 0;
}
.scan-frame::after {
  content:''; position:absolute; bottom:-3px; right:-3px;
  width:40px; height:40px;
  border-bottom:5px solid var(--green); border-right:5px solid var(--green);
  border-radius:0 0 15px 0;
}
.scan-line {
  position:absolute; left:15%; right:15%;
  height:2px; background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation:scanLine 2s linear infinite;
  box-shadow:0 0 15px var(--cyan);
}
@keyframes scanLine {
  0% { top:15%; }
  100% { top:85%; }
}
.status-text {
  text-align:center; padding:1rem;
  font-family:'Orbitron',sans-serif; font-size:1rem;
  border-radius:10px; margin-bottom:1rem;
  background:rgba(0,240,255,0.1);
  border:1px solid var(--border);
  color:var(--cyan);
  letter-spacing:1px;
}
.status-text.success {
  background:rgba(0,255,136,0.15);
  border-color:var(--green); color:var(--green);
  animation:successPulse 0.5s ease;
}
.status-text.error {
  background:rgba(255,0,51,0.15);
  border-color:var(--red); color:var(--red);
  animation:errorShake 0.5s ease;
}
@keyframes successPulse {
  0% { transform:scale(0.95); }
  50% { transform:scale(1.03); }
  100% { transform:scale(1); }
}
@keyframes errorShake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-10px); }
  75% { transform:translateX(10px); }
}
.btn {
  padding:0.8rem 1.6rem; border:none; border-radius:10px;
  font-weight:700; cursor:pointer; transition:all 0.3s;
  text-transform:uppercase; letter-spacing:1px; font-size:0.85rem;
}
.btn-cyan { background:linear-gradient(135deg,#0088aa,var(--cyan)); color:#050510; }
.btn-cyan:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,240,255,0.5); }
.btn-red { background:linear-gradient(135deg,#8b0000,var(--red)); color:#fff; }
.btn-red:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,0,51,0.5); }
.btn-gold { background:linear-gradient(135deg,#b8860b,var(--gold)); color:#1a0033; }
.btn-gold:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,215,0,0.5); }
.btn-dark { background:rgba(255,255,255,0.05); color:var(--text2); border:1px solid var(--border); }
.btn-dark:hover { background:rgba(255,255,255,0.1); color:#fff; }
.btn-full { width:100%; }
.buttons-row { display:flex; gap:0.6rem; flex-wrap:wrap; }
.buttons-row .btn { flex:1; min-width:140px; }
.back-btn {
  display:inline-block; padding:0.7rem 1.6rem; margin-bottom:1rem;
  background:rgba(0,240,255,0.1); border:1px solid var(--cyan);
  border-radius:10px; color:var(--cyan); text-decoration:none;
  font-weight:600; font-size:0.85rem; transition:all 0.3s;
}
.back-btn:hover { background:rgba(0,240,255,0.2); box-shadow:var(--glow); }
.modal-overlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9); backdrop-filter:blur(10px);
  z-index:9999; align-items:center; justify-content:center; padding:2rem;
}
.modal-overlay.active { display:flex; }
.modal-content {
  background:linear-gradient(135deg, #0a0014, #14002a);
  border:2px solid var(--gold); border-radius:22px;
  padding:2rem; max-width:450px; width:100%;
  text-align:center; box-shadow:0 0 60px rgba(255,215,0,0.4);
}
.modal-content h2 {
  font-family:'Orbitron',sans-serif; color:var(--gold);
  font-size:1.4rem; margin-bottom:1rem;
  display:flex; align-items:center; justify-content:center; gap:0.6rem;
}
.modal-content p { color:var(--text2); margin-bottom:1.5rem; font-size:0.9rem; }
.modal-content input {
  width:100%; padding:1rem 1.2rem;
  background:rgba(0,0,0,0.5); border:1px solid var(--gold);
  border-radius:10px; color:#fff; font-size:1rem;
  text-align:center; letter-spacing:2px;
  outline:none; margin-bottom:1rem;
  font-family:'Courier New',monospace;
}
.modal-content input:focus { box-shadow:0 0 20px rgba(255,215,0,0.4); }
.modal-content .error-msg {
  color:var(--red); font-weight:700; min-height:24px;
  margin-bottom:1rem; font-size:0.85rem;
}
.toast {
  position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%);
  background:rgba(0,240,255,0.95); color:#050510;
  padding:0.9rem 1.8rem; border-radius:12px; font-weight:700;
  z-index:10001; animation:fadeInUp 0.3s;
}
.toast.error { background:rgba(255,0,51,0.95); color:#fff; }
.toast.success { background:rgba(0,255,136,0.95); color:#050510; }
.toast.warn { background:rgba(255,215,0,0.95); color:#050510; }
@keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(20px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
.hidden { display:none; }
@media (max-width:768px) {
  body { padding:1rem; }
  .page-header h1 { font-size:1.4rem; }
}
</style>
</head>
<body>
<div class="hologram-grid"></div>

<div class="container">
  <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> RETOUR</a>

  <header class="page-header">
    <h1><i class="fas fa-id-card"></i> SCAN CARTE MEMBRE</h1>
    <p class="subtitle">Accès Espace Direction — Vérification sécurisée</p>
  </header>

  <div class="card-box">
    <div class="status-text" id="statusText">
      <i class="fas fa-camera"></i> Initialisation de la caméra...
    </div>

    <div class="camera-container">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="buttons-row">
      <button class="btn btn-cyan" id="btnStart" onclick="demarrerCamera()">
        <i class="fas fa-camera"></i> ACTIVER CAMÉRA
      </button>
      <button class="btn btn-dark hidden" id="btnStop" onclick="arreterCamera()">
        <i class="fas fa-stop"></i> ARRÊTER
      </button>
    </div>
  </div>

  <div class="card-box">
    <button class="btn btn-gold btn-full" onclick="ouvrirModalAdmin()">
      <i class="fas fa-key"></i> CODE ADMINISTRATEUR (SECOURS)
    </button>
  </div>
</div>

<!-- MODAL CODE ADMIN -->
<div class="modal-overlay" id="modalAdmin">
  <div class="modal-content">
    <h2><i class="fas fa-shield-alt"></i> CODE ADMIN</h2>
    <p>Entrez le code administrateur de secours</p>
    <input type="password" id="inputAdminCode" placeholder="• • • • • • • •" autocomplete="off">
    <div class="error-msg" id="adminError"></div>
    <div class="buttons-row">
      <button class="btn btn-gold" onclick="verifierCodeAdmin()">
        <i class="fas fa-unlock"></i> VALIDER
      </button>
      <button class="btn btn-dark" onclick="fermerModalAdmin()">
        ANNULER
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://olgrpycxudzuxtzjxoma.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3JweWN4dWR6dXh0emp4b21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA4MDUsImV4cCI6MjEwNTkwNjgwNX0.Day-sMRM-l6bBWuqCsho6vBPCKNxZaqUB1TgHbF6-TE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CODE_ADMIN = 'BIRANE-MASTER-AT21-2026';

let video, canvas, ctx, scanning = false, stream = null;

function showToast(msg, type='') {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function setStatus(msg, type='') {
  const el = document.getElementById('statusText');
  el.className = 'status-text ' + type;
  el.innerHTML = msg;
}

// ============ CAMÉRA ============
async function demarrerCamera() {
  video = document.getElementById('video');
  try {
    setStatus('<i class="fas fa-spinner fa-spin"></i> Demande accès caméra...', '');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();

    document.getElementById('btnStart').classList.add('hidden');
    document.getElementById('btnStop').classList.remove('hidden');

    setStatus('<i class="fas fa-qrcode"></i> Présentez le QR code de la carte dans le cadre', '');
    scanning = true;
    requestAnimationFrame(boucleScan);

  } catch (e) {
    setStatus('❌ Impossible d\'accéder à la caméra. ' + e.message, 'error');
    showToast('❌ Caméra refusée. Autorisez l\'accès.', 'error');
  }
}

function arreterCamera() {
  scanning = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  document.getElementById('btnStart').classList.remove('hidden');
  document.getElementById('btnStop').classList.add('hidden');
  setStatus('<i class="fas fa-camera"></i> Caméra arrêtée', '');
}

// ============ SCAN ============
function boucleScan() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    if (!canvas) {
      canvas = document.createElement('canvas');
      ctx = canvas.getContext('2d', { willReadFrequently: true });
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    try {
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });

      if (code && code.data) {
        // Vérifier que c'est bien un QR AFRICA.TECH21
        const data = code.data.trim();
        if (data.startsWith('AFRICA21:')) {
          scanning = false;
          verifierQR(data);
          return;
        }
      }
    } catch (e) { /* continuer */ }
  }
  if (scanning) requestAnimationFrame(boucleScan);
}

// ============ VÉRIFICATION ============
async function verifierQR(qrData) {
  setStatus('<i class="fas fa-spinner fa-spin"></i> Vérification en cours...', '');

  try {
    const { data, error } = await supabaseClient
      .from('cartes_membres')
      .select('*')
      .eq('qr_data', qrData)
      .eq('actif', true)
      .single();

    if (error || !data) {
      setStatus('❌ CARTE INVALIDE — Accès refusé', 'error');
      showToast('❌ Carte non reconnue ou désactivée', 'error');
      // Réactiver le scan après 3 secondes
      setTimeout(() => {
        if (stream) {
          scanning = true;
          setStatus('<i class="fas fa-qrcode"></i> Présentez le QR code de la carte', '');
          requestAnimationFrame(boucleScan);
        }
      }, 3000);
      return;
    }

    // Carte valide !
    await supabaseClient.from('cartes_membres').update({
      derniere_utilisation: new Date().toLocaleString('fr-FR')
    }).eq('id', data.id);

    setStatus('✅ ACCÈS AUTORISÉ — ' + data.membre_nom, 'success');
    showToast('✅ Bienvenue ' + data.membre_nom + ' !', 'success');

    // Sauvegarder les infos du membre scanné
    localStorage.setItem('scan_membre_id', data.membre_id);
    localStorage.setItem('scan_membre_nom', data.membre_nom);

    // Rediriger après 1.5 secondes
    setTimeout(() => {
      window.location.href = 'direction.html?scan=' + data.membre_id;
    }, 1500);

  } catch (e) {
    setStatus('❌ Erreur : ' + e.message, 'error');
  }
}

// ============ CODE ADMIN ============
function ouvrirModalAdmin() {
  document.getElementById('modalAdmin').classList.add('active');
  document.getElementById('inputAdminCode').value = '';
  document.getElementById('adminError').textContent = '';
  setTimeout(() => document.getElementById('inputAdminCode').focus(), 100);
}

function fermerModalAdmin() {
  document.getElementById('modalAdmin').classList.remove('active');
}

function verifierCodeAdmin() {
  const code = document.getElementById('inputAdminCode').value.trim();
  const errEl = document.getElementById('adminError');

  if (code === CODE_ADMIN) {
    setStatus('✅ CODE ADMIN VALIDÉ — Accès autorisé', 'success');
    showToast('✅ Accès administrateur accordé', 'success');
    fermerModalAdmin();
    localStorage.setItem('scan_membre_id', 'AT21_006');
    localStorage.setItem('scan_membre_nom', 'ADMIN');
    setTimeout(() => {
      window.location.href = 'direction.html?scan=admin';
    }, 1200);
  } else {
    errEl.textContent = '❌ Code incorrect';
    document.getElementById('inputAdminCode').value = '';
    setTimeout(() => errEl.textContent = '', 3000);
  }
}

// Touche Entrée dans le champ admin
document.getElementById('inputAdminCode').addEventListener('keypress', e => {
  if (e.key === 'Enter') verifierCodeAdmin();
});

// Clic sur overlay = fermer
document.getElementById('modalAdmin').addEventListener('click', function(e) {
  if (e.target === this) fermerModalAdmin();
});

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  setStatus('<i class="fas fa-info-circle"></i> Cliquez sur "ACTIVER CAMÉRA" pour commencer', '');
});
</script>
</body>
</html>
