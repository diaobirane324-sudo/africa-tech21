<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Responsable Projets | AFRICA.TECH21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
        :root {
            --blood-red: #8b0000;
            --dark-red: #3d0000;
            --neon-red: #ff0033;
            --neon-blue: #0044ff;
            --dark-blue: #001a4d;
            --deep-black: #0a0000;
            --text-primary: #ffffff;
            --text-secondary: #a08080;
            --glass: rgba(255, 0, 0, 0.03);
            --glass-border: rgba(255, 0, 0, 0.2);
            --panel-glow: 0 0 30px rgba(255, 0, 51, 0.3);
        }
        body {
            background: 
                radial-gradient(circle at 20% 20%, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 26, 77, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #0a0000 0%, #050000 50%, #000814 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .hologram-grid {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 0, 51, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 0, 51, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScan 20s linear infinite;
            pointer-events: none; z-index: -2;
        }
        @keyframes gridScan { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle {
            position: absolute; width: 3px; height: 3px;
            background: var(--neon-red); border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px var(--neon-red);
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }
        .back-btn {
            display: inline-block; padding: 0.8rem 2rem; margin-bottom: 2rem;
            background: rgba(255, 0, 51, 0.1); border: 1px solid var(--neon-red);
            border-radius: 10px; color: var(--neon-red); text-decoration: none;
            font-weight: 600; transition: all 0.3s ease;
        }
        .back-btn:hover { background: rgba(255, 0, 51, 0.2); box-shadow: 0 0 20px rgba(255, 0, 51, 0.3); }
        .page-container { max-width: 1300px; margin: 0 auto; }
        .page-header {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.15), rgba(0, 26, 77, 0.15));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 25px;
            padding: 3rem 2.5rem;
            margin-bottom: 2.5rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 51, 0.2);
            position: relative;
            overflow: hidden;
        }
        .page-header::before {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            background: linear-gradient(45deg, var(--neon-red), #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: 900;
            position: relative; z-index: 1;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative; z-index: 1;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 1rem 2rem;
            background: rgba(255, 0, 51, 0.05);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }
        .tab:hover { background: rgba(255, 0, 51, 0.1); }
        .tab.active {
            background: linear-gradient(135deg, var(--dark-red), var(--dark-blue));
            border-color: var(--neon-red);
            color: white;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.4);
        }
        .section { display: none; }
        .section.active { display: block; }
        .card-box {
            background: linear-gradient(135deg, rgba(20, 0, 0, 0.7), rgba(0, 10, 30, 0.7));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.1);
        }
        .card-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-red);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
        }
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 0, 51, 0.15);
        }
        .editor-toolbar button {
            background: rgba(255, 0, 51, 0.08);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 6px;
            padding: 0.5rem 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .editor-toolbar button:hover {
            background: rgba(255, 0, 51, 0.2);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.3);
        }
        #editorContent {
            width: 100%;
            min-height: 400px;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.8;
            outline: none;
            transition: all 0.3s ease;
        }
        #editorContent:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.2);
        }
        #editorContent img {
            max-width: 100%;
            border-radius: 10px;
            margin: 1rem 0;
        }
        #editorContent table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        #editorContent table td, #editorContent table th {
            border: 1px solid rgba(255, 0, 51, 0.3);
            padding: 0.5rem;
        }
        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        .btn-danger { background: linear-gradient(135deg, var(--blood-red), var(--neon-red)); color: white; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 0, 51, 0.5); }
        .btn-blue { background: linear-gradient(135deg, var(--dark-blue), var(--neon-blue)); color: white; }
        .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 68, 255, 0.5); }
        .btn-dark { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border: 1px solid rgba(255, 0, 51, 0.2); }
        .btn-dark:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
        .input-full {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            margin-bottom: 1rem;
        }
        .input-full:focus { border-color: var(--neon-red); box-shadow: 0 0 20px rgba(255, 0, 51, 0.2); }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 51, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.2);
        }
        .form-group select option { background: var(--deep-black); }
        .list-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 51, 0.15);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .list-item:hover {
            border-color: var(--neon-red);
            background: rgba(255, 0, 51, 0.05);
            transform: translateX(5px);
        }
        .list-item .title { color: var(--neon-red); font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .list-item .meta { color: var(--text-secondary); font-size: 0.85rem; }
        .list-item .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .list-item .actions button {
            background: rgba(255, 0, 51, 0.1);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 8px;
            color: var(--neon-red);
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .list-item .actions button:hover { background: rgba(255, 0, 51, 0.2); }
        .list-item .actions button.delete { color: #ff4757; border-color: rgba(255, 71, 87, 0.3); background: rgba(255, 71, 87, 0.05); }
        .list-item .actions button.delete:hover { background: rgba(255, 71, 87, 0.2); }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem; }
        .loading-text { text-align: center; color: var(--text-secondary); padding: 2rem; }
        .loading-spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid rgba(255, 0, 51, 0.2);
            border-top: 3px solid var(--neon-red);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, #0a0000 0%, #000814 100%);
            border: 1px solid rgba(255, 0, 51, 0.3);
            border-radius: 25px;
            max-width: 700px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            padding: 2.5rem;
            box-shadow: 0 0 60px rgba(255, 0, 51, 0.4);
        }
        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 51, 0.95);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            z-index: 10001;
            animation: fadeInUp 0.3s ease;
        }
        .toast.success { background: rgba(0, 255, 136, 0.95); color: #050510; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .page-header h1 { font-size: 1.8rem; }
            .card-box { padding: 1.5rem; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="hologram-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="page-container">
        <a href="direction.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> RETOUR ESPACE DIRECTION
        </a>

        <header class="page-header">
            <h1><i class="fas fa-project-diagram"></i> ESPACE RESPONSABLE PROJETS</h1>
            <p class="subtitle">Gestion des projets et évaluation des travaux</p>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('redaction')">
                <i class="fas fa-edit"></i> RÉDACTION PROJETS
            </div>
            <div class="tab" onclick="switchTab('evaluations')">
                <i class="fas fa-star"></i> ÉVALUATIONS
            </div>
        </div>

        <!-- SECTION RÉDACTION -->
        <div class="section active" id="sectionRedaction">
            <div class="card-box">
                <h2><i class="fas fa-pen-fancy"></i> ÉDITEUR DE PROJETS</h2>

                <input type="text" id="projetTitle" class="input-full" placeholder="Titre du projet...">

                <div class="editor-toolbar">
                    <button onclick="execCmd('bold')" title="Gras"><i class="fas fa-bold"></i></button>
                    <button onclick="execCmd('italic')" title="Italique"><i class="fas fa-italic"></i></button>
                    <button onclick="execCmd('underline')" title="Souligné"><i class="fas fa-underline"></i></button>
                    <button onclick="execCmd('strikeThrough')" title="Barré"><i class="fas fa-strikethrough"></i></button>
                    <span style="width:1px; height:24px; background:rgba(255,0,51,0.2); align-self:center;"></span>
                    <button onclick="execCmd('formatBlock','h1')" title="Titre 1">H1</button>
                    <button onclick="execCmd('formatBlock','h2')" title="Titre 2">H2</button>
                    <button onclick="execCmd('formatBlock','h3')" title="Titre 3">H3</button>
                    <button onclick="execCmd('formatBlock','p')" title="Paragraphe">P</button>
                    <span style="width:1px; height:24px; background:rgba(255,0,51,0.2); align-self:center;"></span>
                    <button onclick="execCmd('insertUnorderedList')" title="Liste à puces"><i class="fas fa-list-ul"></i></button>
                    <button onclick="execCmd('insertOrderedList')" title="Liste numérotée"><i class="fas fa-list-ol"></i></button>
                    <span style="width:1px; height:24px; background:rgba(255,0,51,0.2); align-self:center;"></span>
                    <button onclick="execCmd('justifyLeft')" title="Aligner à gauche"><i class="fas fa-align-left"></i></button>
                    <button onclick="execCmd('justifyCenter')" title="Centrer"><i class="fas fa-align-center"></i></button>
                    <button onclick="execCmd('justifyRight')" title="Aligner à droite"><i class="fas fa-align-right"></i></button>
                    <span style="width:1px; height:24px; background:rgba(255,0,51,0.2); align-self:center;"></span>
                    <button onclick="insertLink()" title="Lien"><i class="fas fa-link"></i></button>
                    <button onclick="insertImage()" title="Image"><i class="fas fa-image"></i></button>
                    <button onclick="insertTable()" title="Tableau"><i class="fas fa-table"></i></button>
                    <button onclick="execCmd('insertHorizontalRule')" title="Séparateur"><i class="fas fa-minus"></i></button>
                    <span style="width:1px; height:24px; background:rgba(255,0,51,0.2); align-self:center;"></span>
                    <button onclick="execCmd('removeFormat')" title="Effacer format"><i class="fas fa-eraser"></i></button>
                </div>

                <div id="editorContent" contenteditable="true" placeholder="Rédigez votre projet ici..."></div>

                <div class="editor-actions">
                    <button class="btn btn-danger" onclick="saveProjet()"><i class="fas fa-save"></i> SAUVEGARDER</button>
                    <button class="btn btn-blue" onclick="loadProjets()"><i class="fas fa-sync"></i> SYNC</button>
                    <button class="btn btn-dark" onclick="clearEditor()"><i class="fas fa-eraser"></i> EFFACER</button>
                </div>
                <input type="hidden" id="editProjetId" value="">
            </div>

            <div class="card-box">
                <h2><i class="fas fa-archive"></i> PROJETS RÉDIGÉS</h2>
                <div id="projetsList">
                    <div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>
                </div>
            </div>
        </div>

        <!-- SECTION ÉVALUATIONS -->
        <div class="section" id="sectionEvaluations">
            <div class="card-box">
                <h2><i class="fas fa-star"></i> ÉVALUER UN TRAVAIL</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label>Type de travail</label>
                        <select id="evalType">
                            <option value="Rapport quotidien">📋 Rapport quotidien</option>
                            <option value="Projet">📁 Projet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ID du membre</label>
                        <input type="text" id="evalCibleId" placeholder="Ex: AT21_006">
                    </div>
                    <div class="form-group">
                        <label>Nom du membre</label>
                        <input type="text" id="evalCibleNom" placeholder="Ex: DIAO BIRANE">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Note (/20)</label>
                        <input type="number" id="evalNote" min="0" max="20" step="1" placeholder="Ex: 15">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Commentaire</label>
                    <textarea id="evalCommentaire" rows="4" placeholder="Commentaire sur le travail..."></textarea>
                </div>

                <button class="btn btn-danger" onclick="saveEvaluation()"><i class="fas fa-check"></i> ENREGISTRER L'ÉVALUATION</button>
            </div>

            <div class="card-box">
                <h2><i class="fas fa-clipboard-list"></i> HISTORIQUE DES ÉVALUATIONS</h2>
                <div id="evaluationsList">
                    <div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL VIEW -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-content">
            <h2><i class="fas fa-file-alt"></i> <span id="viewTitle">Titre</span></h2>
            <div class="meta" id="viewMeta" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></div>
            <div id="viewBody" style="line-height: 1.8;"></div>
            <div style="margin-top: 2rem;">
                <button class="btn btn-dark" onclick="closeViewModal()">FERMER</button>
            </div>
        </div>
    </div>

    <!-- ==================== SUPABASE ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== CONFIGURATION ====================
        const SUPABASE_URL = 'https://olgrpycxudzuxtzjxoma.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3JweWN4dWR6dXh0emp4b21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA4MDUsImV4cCI6MjEwNTkwNjgwNX0.Day-sMRM-l6bBWuqCsho6vBPCKNxZaqUB1TgHbF6-TE';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== ACCÈS ====================
        const ALLOWED_IDS = ['AT21_0011', 'AT21_006', 'Birane186@00'];
        if (localStorage.getItem('memberLoggedIn') !== 'true') window.location.href = 'espace-membres.html';
        const memberId = localStorage.getItem('memberId') || '';
        if (!ALLOWED_IDS.includes(memberId)) {
            document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;gap:1rem;"><i class="fas fa-lock" style="font-size:4rem;color:#ff0033;"></i><h1 style="color:#ff0033;">ACCÈS REFUSÉ</h1><a href="dashboard.html" style="color:#00f0ff;">Retour</a></div>';
            throw new Error('Accès refusé');
        }

        const memberNom = localStorage.getItem('memberNom') || '';
        const memberPrenom = localStorage.getItem('memberPrenom') || '';

        // ==================== TOAST ====================
        function showToast(msg, type='') {
            const old = document.querySelector('.toast'); if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // ==================== TABS ====================
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.target.closest('.tab').classList.add('active');
            document.getElementById('section' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
        }

        // ==================== ÉDITEUR ====================
        function execCmd(cmd, val=null) {
            document.execCommand(cmd, false, val);
            document.getElementById('editorContent').focus();
        }

        function insertLink() {
            const url = prompt('URL du lien :');
            if (url) execCmd('createLink', url);
        }

        function insertImage() {
            const url = prompt('URL de l\'image :');
            if (url) execCmd('insertImage', url);
        }

        function insertTable() {
            const rows = prompt('Nombre de lignes :', '3');
            const cols = prompt('Nombre de colonnes :', '3');
            if (!rows || !cols) return;
            let html = '<table>';
            for (let i = 0; i < rows; i++) {
                html += '<tr>';
                for (let j = 0; j < cols; j++) html += '<td>&nbsp;</td>';
                html += '</tr>';
            }
            html += '</table>';
            execCmd('insertHTML', html);
        }

        function clearEditor() {
            if (confirm('Effacer le contenu ?')) {
                document.getElementById('editorContent').innerHTML = '';
                document.getElementById('projetTitle').value = '';
                document.getElementById('editProjetId').value = '';
            }
        }

        // ==================== PROJETS ====================
        async function saveProjet() {
            const title = document.getElementById('projetTitle').value.trim() || 'Sans titre';
            const content = document.getElementById('editorContent').innerHTML.trim();
            const editId = document.getElementById('editProjetId').value;

            if (!content || content === '<br>') { showToast('⚠️ Écrivez du contenu.', ''); return; }

            const now = new Date();
            const payload = {
                title, content,
                author: `${memberPrenom} ${memberNom}`,
                author_id: memberId,
                date: now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };

            try {
                let res;
                if (editId) res = await supabaseClient.from('projets_redaction').update(payload).eq('id', editId);
                else res = await supabaseClient.from('projets_redaction').insert([payload]);

                if (res.error) throw res.error;

                showToast('✅ Projet sauvegardé !', 'success');
                document.getElementById('editorContent').innerHTML = '';
                document.getElementById('projetTitle').value = '';
                document.getElementById('editProjetId').value = '';
                loadProjets();
            } catch (e) { showToast('❌ ' + e.message); }
        }

        async function loadProjets() {
            const c = document.getElementById('projetsList');
            c.innerHTML = '<div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>';
            try {
                const { data, error } = await supabaseClient.from('projets_redaction').select('*').order('timestamp', {ascending: false});
                if (error) throw error;
                if (!data || data.length === 0) { c.innerHTML = '<div class="empty-state">📭 Aucun projet.</div>'; return; }
                c.innerHTML = data.map(p => `
                    <div class="list-item">
                        <div class="title">${p.title}</div>
                        <div class="meta">📅 ${p.date} - ✍️ ${p.author}</div>
                        <div class="actions">
                            <button onclick="viewProjet('${p.id}')"><i class="fas fa-eye"></i> Voir</button>
                            <button onclick="editProjet('${p.id}')"><i class="fas fa-edit"></i> Modifier</button>
                            <button class="delete" onclick="deleteProjet('${p.id}')"><i class="fas fa-trash"></i> Supprimer</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { c.innerHTML = '<div class="empty-state">❌ ' + e.message + '</div>'; }
        }

        let projetsCache = [];

        async function viewProjet(id) {
            const { data } = await supabaseClient.from('projets_redaction').select('*').eq('id', id).single();
            if (!data) return;
            document.getElementById('viewTitle').textContent = data.title;
            document.getElementById('viewMeta').textContent = `📅 ${data.date} - ✍️ ${data.author}`;
            document.getElementById('viewBody').innerHTML = data.content;
            document.getElementById('viewModal').classList.add('active');
        }

        function closeViewModal() { document.getElementById('viewModal').classList.remove('active'); }

        async function editProjet(id) {
            const { data } = await supabaseClient.from('projets_redaction').select('*').eq('id', id).single();
            if (!data) return;
            document.getElementById('projetTitle').value = data.title;
            document.getElementById('editorContent').innerHTML = data.content;
            document.getElementById('editProjetId').value = id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProjet(id) {
            if (!confirm('Supprimer ce projet ?')) return;
            try {
                const { error } = await supabaseClient.from('projets_redaction').delete().eq('id', id);
                if (error) throw error;
                showToast('🗑️ Projet supprimé.', 'success');
                loadProjets();
            } catch (e) { showToast('❌ ' + e.message); }
        }

        // ==================== ÉVALUATIONS ====================
        async function saveEvaluation() {
            const type = document.getElementById('evalType').value;
            const cibleId = document.getElementById('evalCibleId').value.trim();
            const cibleNom = document.getElementById('evalCibleNom').value.trim();
            const note = document.getElementById('evalNote').value;
            const commentaire = document.getElementById('evalCommentaire').value.trim();

            if (!cibleId || !cibleNom) { showToast('⚠️ Remplissez ID et Nom.'); return; }
            if (!note || note < 0 || note > 20) { showToast('⚠️ Note entre 0 et 20.'); return; }

            const now = new Date();
            const payload = {
                type_travail: type,
                cible_id: cibleId,
                cible_nom: cibleNom,
                note: parseInt(note),
                commentaire: commentaire,
                evaluateur: `${memberPrenom} ${memberNom}`,
                evaluateur_id: memberId,
                date: now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };

            try {
                const { error } = await supabaseClient.from('evaluations').insert([payload]);
                if (error) throw error;
                showToast('✅ Évaluation enregistrée !', 'success');
                document.getElementById('evalCibleId').value = '';
                document.getElementById('evalCibleNom').value = '';
                document.getElementById('evalNote').value = '';
                document.getElementById('evalCommentaire').value = '';
                loadEvaluations();
            } catch (e) { showToast('❌ ' + e.message); }
        }

        async function loadEvaluations() {
            const c = document.getElementById('evaluationsList');
            c.innerHTML = '<div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>';
            try {
                const { data, error } = await supabaseClient.from('evaluations').select('*').order('timestamp', {ascending: false});
                if (error) throw error;
                if (!data || data.length === 0) { c.innerHTML = '<div class="empty-state">📭 Aucune évaluation.</div>'; return; }
                c.innerHTML = data.map(e => `
                    <div class="list-item">
                        <div class="title">⭐ ${e.note}/20 - ${e.cible_nom} (${e.cible_id})</div>
                        <div class="meta">📋 ${e.type_travail} — 📅 ${e.date} — ✍️ ${e.evaluateur}</div>
                        <div class="meta" style="margin-top:0.5rem; color:#fff;">${e.commentaire || ''}</div>
                        <div class="actions">
                            <button class="delete" onclick="deleteEvaluation('${e.id}')"><i class="fas fa-trash"></i> Supprimer</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { c.innerHTML = '<div class="empty-state">❌ ' + e.message + '</div>'; }
        }

        async function deleteEvaluation(id) {
            if (!confirm('Supprimer cette évaluation ?')) return;
            try {
                const { error } = await supabaseClient.from('evaluations').delete().eq('id', id);
                if (error) throw error;
                showToast('🗑️ Évaluation supprimée.', 'success');
                loadEvaluations();
            } catch (e) { showToast('❌ ' + e.message); }
        }

        // ==================== INIT ====================
        loadProjets();
        loadEvaluations();
    </script>
</body>
</html>
