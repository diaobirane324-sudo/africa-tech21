<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rédaction Projet | AFRICA.TECH21</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Exo 2','Segoe UI',sans-serif; }
    :root{
        --gold:#ffd700; --gold-glow:0 0 30px rgba(255,215,0,.5);
        --neon-green:#00ff88; --neon-blue:#00f0ff; --neon-purple:#7b2cbf;
        --deep-space:#050510; --dark-space:#0a0a12;
        --text-primary:#fff; --text-secondary:#a0a8c0;
        --glass:rgba(255,255,255,.05); --glass-border:rgba(255,255,255,.1);
    }
    body{
        background:
            radial-gradient(circle at 20% 20%, rgba(255,215,0,.05) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(123,44,191,.08) 0%, transparent 50%),
            linear-gradient(135deg,var(--deep-space) 0%,var(--dark-space) 50%,#0f0f1f 100%);
        color:var(--text-primary); min-height:100vh; padding:2rem;
    }
    .hologram-grid{
        position:fixed; top:0; left:0; width:100%; height:100%;
        background:
            linear-gradient(90deg, rgba(255,215,0,.02) 1px, transparent 1px),
            linear-gradient(180deg, rgba(255,215,0,.02) 1px, transparent 1px);
        background-size:60px 60px; animation:gridScan 25s linear infinite;
        pointer-events:none; z-index:-2;
    }
    @keyframes gridScan{0%{transform:translate(0,0);}100%{transform:translate(60px,60px);}}
    .page-container{max-width:1400px; margin:0 auto;}
    .back-btn{
        display:inline-block; padding:.8rem 2rem; margin-bottom:2rem;
        background:rgba(255,215,0,.1); border:1px solid var(--gold);
        border-radius:10px; color:var(--gold); text-decoration:none;
        font-weight:600; transition:all .3s ease;
    }
    .back-btn:hover{background:rgba(255,215,0,.2); box-shadow:var(--gold-glow);}
    .page-header{
        background:linear-gradient(135deg, rgba(255,215,0,.08), rgba(123,44,191,.08));
        backdrop-filter:blur(20px); border:1px solid rgba(255,215,0,.3);
        border-radius:30px; padding:3rem 2.5rem; margin-bottom:2.5rem;
        text-align:center; box-shadow:0 0 60px rgba(255,215,0,.15);
        position:relative; overflow:hidden;
    }
    .page-header::before{
        content:''; position:absolute; top:-50%; left:-50%;
        width:200%; height:200%;
        background:radial-gradient(circle, rgba(255,215,0,.05) 0%, transparent 60%);
        animation:rotateGlow 20s linear infinite;
    }
    @keyframes rotateGlow{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
    .page-header h1{
        font-family:'Orbitron',sans-serif; font-size:2.6rem;
        background:linear-gradient(45deg,var(--gold),#fff,var(--gold));
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        background-clip:text; letter-spacing:3px; font-weight:900;
        position:relative; z-index:1;
    }
    .page-header .subtitle{
        color:var(--text-secondary); margin-top:.8rem; font-size:1rem;
        letter-spacing:2px; text-transform:uppercase; position:relative; z-index:1;
    }
    .user-info{
        margin-top:1.2rem; display:inline-block;
        background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.3);
        padding:.6rem 1.6rem; border-radius:20px; color:var(--gold);
        font-weight:600; font-size:.9rem; position:relative; z-index:1;
    }
    .toolbar{
        display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:2rem;
        justify-content:space-between; align-items:center;
    }
    .toolbar-left, .toolbar-right { display:flex; gap:.8rem; flex-wrap:wrap; }
    .btn-main{
        display:inline-flex; align-items:center; gap:.6rem;
        padding:.9rem 1.6rem; border-radius:12px;
        background:linear-gradient(135deg,var(--gold),#ff8c00);
        color:#0a0505; font-weight:700; border:none;
        cursor:pointer; transition:all .3s ease;
        font-family:'Orbitron',sans-serif; letter-spacing:1px; font-size:.85rem;
        text-transform:uppercase;
    }
    .btn-main:hover{transform:translateY(-3px); box-shadow:0 10px 30px rgba(255,215,0,.5);}
    .btn-ghost{
        display:inline-flex; align-items:center; gap:.6rem;
        padding:.9rem 1.6rem; border-radius:12px;
        background:rgba(255,215,0,.08); color:var(--gold);
        border:1px solid rgba(255,215,0,.4); font-weight:700;
        cursor:pointer; transition:all .3s ease;
        font-family:'Orbitron',sans-serif; letter-spacing:1px; font-size:.85rem;
        text-transform:uppercase;
    }
    .btn-ghost:hover{background:rgba(255,215,0,.18);}
    .btn-mic{
        display:inline-flex; align-items:center; gap:.6rem;
        padding:.9rem 1.6rem; border-radius:12px;
        background:rgba(0,255,136,.08); color:var(--neon-green);
        border:1px solid var(--neon-green); font-weight:700;
        cursor:pointer; transition:all .3s ease;
        font-family:'Orbitron',sans-serif; letter-spacing:1px; font-size:.85rem;
        text-transform:uppercase;
    }
    .btn-mic:hover{background:rgba(0,255,136,.18);}
    .btn-mic.active{background:rgba(0,255,136,.3); box-shadow:0 0 25px rgba(0,255,136,.5);}
    .section-title{
        font-family:'Orbitron',sans-serif; font-size:1.4rem; color:var(--gold);
        margin-bottom:1.4rem; display:flex; align-items:center; gap:.8rem;
        letter-spacing:2px;
    }
    .section-title i{color:var(--neon-green);}
    .grid-redactions{
        display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
        gap:1.5rem; margin-bottom:2.5rem;
    }
    .card-redaction{
        background:linear-gradient(135deg, rgba(255,215,0,.04), rgba(123,44,191,.04));
        backdrop-filter:blur(15px);
        border:1px solid rgba(255,215,0,.2);
        border-radius:20px; padding:1.8rem;
        transition:all .3s ease; cursor:pointer; position:relative;
        overflow:hidden;
    }
    .card-redaction::before{
        content:''; position:absolute; top:0; left:-100%;
        width:100%; height:100%;
        background:linear-gradient(90deg, transparent, rgba(255,215,0,.08), transparent);
        transition:.6s;
    }
    .card-redaction:hover{
        transform:translateY(-6px); border-color:var(--gold);
        box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 40px rgba(255,215,0,.3);
    }
    .card-redaction:hover::before{left:100%;}
    .card-redaction .badge-source{
        display:inline-block; padding:.2rem .8rem;
        background:rgba(0,240,255,.12); border:1px solid var(--neon-blue);
        border-radius:10px; font-size:.7rem; color:var(--neon-blue);
        letter-spacing:1.5px; margin-bottom:1rem;
        font-family:'Orbitron',sans-serif;
    }
    .card-redaction .badge-statut{
        display:inline-block; padding:.2rem .8rem;
        background:rgba(0,255,136,.12); border:1px solid var(--neon-green);
        border-radius:10px; font-size:.7rem; color:var(--neon-green);
        letter-spacing:1.5px; margin-bottom:1rem; margin-left:.4rem;
        font-family:'Orbitron',sans-serif;
    }
    .card-redaction h3{
        font-family:'Orbitron',sans-serif; color:var(--gold);
        font-size:1.2rem; margin-bottom:.6rem; letter-spacing:1px;
    }
    .card-redaction p{
        color:var(--text-secondary); font-size:.9rem;
        line-height:1.5; margin-bottom:1rem;
    }
    .card-redaction .meta{
        color:var(--text-secondary); font-size:.75rem;
        border-top:1px solid rgba(255,255,255,.08);
        padding-top:.7rem; display:flex; justify-content:space-between;
    }
    .empty-state{
        text-align:center; padding:3rem 1.5rem;
        border:1px dashed rgba(255,215,0,.3); border-radius:20px;
        color:var(--text-secondary); margin-bottom:2rem;
    }
    .empty-state i{
        font-size:3rem; color:var(--gold); margin-bottom:1rem;
        display:block; opacity:.6;
    }
    #formSection{display:none;}
    .form-card{
        background:linear-gradient(135deg, rgba(255,215,0,.03), rgba(123,44,191,.03));
        backdrop-filter:blur(15px);
        border:1px solid rgba(255,215,0,.25);
        border-radius:20px; padding:2rem; margin-bottom:1.5rem;
    }
    .form-row{display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{
        display:block; color:var(--gold); font-weight:600;
        font-size:.85rem; margin-bottom:.5rem;
        font-family:'Orbitron',sans-serif; letter-spacing:1px;
    }
    .form-group label .req{color:#ff4757; margin-left:.3rem;}
    .form-group input[type="text"],
    .form-group textarea,
    .form-group select{
        width:100%; padding:.9rem 1rem;
        background:rgba(255,255,255,.05);
        border:1px solid rgba(255,215,0,.25);
        border-radius:10px; color:var(--text-primary);
        font-family:'Exo 2',sans-serif; font-size:.95rem;
        outline:none; transition:all .3s ease;
        resize:vertical;
    }
    .form-group textarea{min-height:90px; line-height:1.6;}
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus{
        border-color:var(--gold);
        box-shadow:0 0 20px rgba(255,215,0,.3);
        background:rgba(255,215,0,.05);
    }
    .form-group .hint{
        color:var(--text-secondary); font-size:.75rem;
        margin-top:.4rem; font-style:italic;
    }
    .form-actions{
        display:flex; flex-wrap:wrap; gap:1rem;
        justify-content:space-between; margin-top:1.5rem;
        padding-top:1.5rem;
        border-top:1px solid rgba(255,255,255,.08);
    }
    .voice-status{
        position:fixed; bottom:1.5rem; right:1.5rem;
        background:linear-gradient(135deg, #0a0a12, #050510);
        border:2px solid var(--neon-green);
        border-radius:15px; padding:1rem 1.4rem;
        color:var(--neon-green); font-weight:600;
        font-size:.85rem; max-width:320px;
        box-shadow:0 0 40px rgba(0,255,136,.4);
        z-index:9998; display:none;
    }
    .voice-status.show{display:block; animation:voiceAppear .3s ease;}
    @keyframes voiceAppear{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:translateY(0);}}

    /* ============================================================
       DOCUMENT PDF — rendu dédié pour impression parfaite
       ============================================================ */
    #pdfDocument { display:none; }

    @media print {
        /* On cache TOUT */
        body > * { display:none !important; }
        /* On affiche uniquement le document PDF */
        #pdfDocument { display:block !important; }
        body{
            background:#fff !important; color:#000 !important;
            padding:0 !important; margin:0 !important;
            font-family:'Exo 2','Segoe UI',sans-serif !important;
        }
        @page { size:A4; margin:18mm 16mm 18mm 16mm; }
    }

    /* Styles du document PDF (écran + impression) */
    #pdfDocument{
        color:#1a1a1a;
        font-family:'Exo 2','Segoe UI',sans-serif;
        font-size:11.5pt;
        line-height:1.65;
    }
    #pdfDocument .pdf-cover{
        text-align:center;
        padding:40mm 15mm 30mm 15mm;
        border-bottom:3px solid #6a0dad;
        margin-bottom:14mm;
        page-break-after:always;
    }
    #pdfDocument .pdf-cover .logo{
        font-family:'Orbitron',sans-serif;
        font-size:22pt; font-weight:900;
        letter-spacing:4px;
        color:#6a0dad;
        margin-bottom:6mm;
    }
    #pdfDocument .pdf-cover .logo small{
        display:block; font-size:10pt;
        letter-spacing:8px; color:#999; margin-top:2mm;
        font-weight:400;
    }
    #pdfDocument .pdf-cover h1{
        font-family:'Orbitron',sans-serif;
        font-size:24pt;
        color:#0a0a12;
        margin:18mm 0 6mm;
        line-height:1.3;
    }
    #pdfDocument .pdf-cover .sub{
        font-size:13pt;
        color:#6a0dad;
        font-weight:600;
        margin-bottom:18mm;
    }
    #pdfDocument .pdf-cover .meta-block{
        display:inline-block;
        text-align:left;
        border:1px solid #ddd;
        border-radius:6px;
        padding:6mm 10mm;
        font-size:10.5pt;
        color:#333;
        line-height:1.9;
    }
    #pdfDocument .pdf-cover .meta-block strong{ color:#6a0dad; }
    #pdfDocument .pdf-cover .footer-cover{
        margin-top:22mm;
        font-size:9pt;
        color:#888;
        letter-spacing:2px;
        text-transform:uppercase;
    }

    #pdfDocument .pdf-section{
        margin-bottom:9mm;
        page-break-inside:auto;
    }
    #pdfDocument .pdf-section-title{
        font-family:'Orbitron',sans-serif;
        font-size:14pt;
        color:#6a0dad;
        border-left:5px solid #ffd700;
        padding:1mm 0 1mm 4mm;
        margin:8mm 0 4mm;
        letter-spacing:1.5px;
        page-break-after:avoid;
        page-break-inside:avoid;
    }
    #pdfDocument .pdf-section-num{
        display:inline-block;
        background:#6a0dad;
        color:#fff;
        font-size:10pt;
        padding:.5mm 2.5mm;
        border-radius:3px;
        margin-right:3mm;
        letter-spacing:1px;
    }
    #pdfDocument .pdf-text{
        text-align:justify;
        white-space:pre-wrap;
        word-wrap:break-word;
        overflow-wrap:break-word;
        color:#222;
        font-size:11.5pt;
        line-height:1.7;
    }
    #pdfDocument .pdf-empty{
        color:#999;
        font-style:italic;
        font-size:10.5pt;
        padding:2mm 0;
        border-bottom:1px dashed #ccc;
    }
    #pdfDocument .pdf-footer{
        margin-top:12mm;
        padding-top:6mm;
        border-top:2px solid #6a0dad;
        display:flex;
        justify-content:space-between;
        font-size:9pt;
        color:#666;
    }
    #pdfDocument .pdf-footer .page-num{
        font-weight:700;
        color:#6a0dad;
    }
    #pdfDocument .pdf-signature-block{
        margin-top:14mm;
        display:flex;
        justify-content:space-between;
        gap:8mm;
        page-break-inside:avoid;
    }
    #pdfDocument .pdf-signature{
        flex:1;
        text-align:center;
        border:1px solid #ddd;
        border-radius:6px;
        padding:6mm 4mm;
    }
    #pdfDocument .pdf-signature .role{
        font-family:'Orbitron',sans-serif;
        font-size:9pt;
        color:#6a0dad;
        letter-spacing:1.5px;
        margin-bottom:3mm;
    }
    #pdfDocument .pdf-signature .name{
        font-size:11pt;
        font-weight:700;
        color:#0a0a12;
        margin-bottom:8mm;
    }
    #pdfDocument .pdf-signature .line{
        border-bottom:1px solid #999;
        margin:0 auto 2mm;
        width:80%;
        height:10mm;
    }
    #pdfDocument .pdf-signature .label{
        font-size:8pt;
        color:#888;
        font-style:italic;
    }
</style>

<body>
<div class="hologram-grid"></div>

<div class="page-container">
    <a href="espace-direction.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> RETOUR ESPACE DIRECTION
    </a>

    <header class="page-header">
        <h1>RÉDACTION PROJET</h1>
        <p class="subtitle">Centre de rédaction des projets pour financeurs</p>
        <div class="user-info" id="userInfo">
            <i class="fas fa-user-shield"></i> Chargement...
        </div>
    </header>

    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn-main" onclick="nouveauProjet()">
                <i class="fas fa-plus-circle"></i> Nouveau projet
            </button>
            <button class="btn-ghost" onclick="ajouterSourcePersonnalisee()">
                <i class="fas fa-file-import"></i> Ajouter un projet source
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn-mic" id="btnVoice" onclick="toggleVoice()">
                <i class="fas fa-microphone"></i> Commande vocale
            </button>
        </div>
    </div>

    <div id="listSection">
        <h2 class="section-title"><i class="fas fa-folder-open"></i> MES RÉDACTIONS</h2>
        <div class="grid-redactions" id="gridRedactions">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                Chargement des rédactions...
            </div>
        </div>

        <h2 class="section-title" style="margin-top:2rem;"><i class="fas fa-cubes"></i> PROJETS SOURCES DISPONIBLES</h2>
        <div class="grid-redactions" id="gridSources"></div>
    </div>

    <div id="formSection">
        <div class="form-card">
            <h2 class="section-title">
                <i class="fas fa-edit"></i>
                <span id="formTitle">Nouvelle rédaction</span>
            </h2>

            <div class="form-row">
                <div class="form-group">
                    <label>PROJET SOURCE</label>
                    <select id="fProjetSource" onchange="onSourceChange()">
                        <option value="">— Rédaction libre —</option>
                    </select>
                    <div class="hint">Sélectionnez un projet existant pour pré-remplir automatiquement.</div>
                </div>
                <div class="form-group">
                    <label>TITRE DU PROJET <span class="req">*</span></label>
                    <input type="text" id="fTitre" placeholder="Ex : IRRITECH — Système d'arrosage automatique">
                </div>
            </div>

            <div class="form-group">
                <label>CONTEXTE <span class="req">*</span></label>
                <textarea id="fContexte" placeholder="Contexte général, situation actuelle, problème sociétal..."></textarea>
            </div>

            <div class="form-group">
                <label>ÉTUDE DU PROBLÈME <span class="req">*</span></label>
                <textarea id="fProbleme" placeholder="Décrivez le problème : causes, conséquences, populations affectées..."></textarea>
            </div>

            <div class="form-group">
                <label>OBJECTIFS (SMART) <span class="req">*</span></label>
                <textarea id="fObjectifs" placeholder="Objectif général + objectifs spécifiques, mesurables..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>BÉNÉFICIAIRES</label>
                    <textarea id="fBeneficiaires"></textarea>
                </div>
                <div class="form-group">
                    <label>RÉALISATIONS / ACTIVITÉS</label>
                    <textarea id="fRealisations"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>PARTENAIRES</label>
                    <textarea id="fPartenaires"></textarea>
                </div>
                <div class="form-group">
                    <label>BUDGET / FINANCEMENT</label>
                    <textarea id="fBudget" placeholder="Laissé vide si non disponible — à compléter par le responsable finance."></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>BÉNÉFICE POUR LE FINANCEUR</label>
                <textarea id="fBeneficeFinanceur"></textarea>
            </div>

            <div class="form-actions">
                <div style="display:flex; gap:.8rem; flex-wrap:wrap;">
                    <button class="btn-main" onclick="sauvegarderProjet()">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                    <button class="btn-mic" onclick="verifierDocument()">
                        <i class="fas fa-check-circle"></i> Vérifier
                    </button>
                    <button class="btn-main" onclick="telechargerPDF()">
                        <i class="fas fa-file-pdf"></i> Télécharger PDF
                    </button>
                </div>
                <div>
                    <button class="btn-ghost" onclick="retourListe()">
                        <i class="fas fa-times"></i> Retour liste
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

    titre:'IRRITECH — Système d\'arrosage automatique intelligent',
    contexte:"L'agriculture africaine fait face à un défi majeur : l'arrosage manuel des cultures est chronophage, inefficace en eau et difficile à maintenir sur de grandes surfaces. Les petits et moyens exploitants perdent régulièrement des récoltes à cause d'un arrosage insuffisant ou mal dosé. IRRITECH propose un système d'arrosage automatique intelligent capable de décider quand et combien arroser, en s'adaptant à l'humidité réelle du sol et aux besoins spécifiques des plantes. Une première version à petite échelle a déjà été conçue par AFRICA.TECH21 ; cette nouvelle version doit être adaptée aux grandes surfaces agricoles.",
    probleme:"Les agriculteurs africains, en particulier les petits exploitants, font face à plusieurs problèmes structurels liés à l'irrigation : (1) la dépendance à l'arrosage manuel entraîne une consommation excessive ou insuffisante d'eau ; (2) les sécheresses récurrentes et le changement climatique rendent l'eau plus rare et plus coûteuse ; (3) les pertes de récoltes dues à un arrosage inadapté (sur-arrosage ou sous-arrosage) réduisent les rendements et les revenus ; (4) l'absence d'outils intelligents accessibles empêche les agriculteurs de piloter finement l'humidité du sol ; (5) les solutions importées sont chères, non adaptées aux réalités locales (variabilité climatique, sols, variétés cultivées) et difficiles à réparer. Conséquences : baisse des rendements, gaspillage d'eau, exode rural, insécurité alimentaire. Population affectée : petits et moyens agriculteurs, coopératives, communautés rurales.",
    objectifs:"Objectif général : concevoir et déployer un système d'arrosage automatique intelligent, autonome et accessible aux exploitations agricoles africaines. Objectifs spécifiques (SMART) : (1) mettre au point un système piloté par ESP32 lisant 4 capteurs d'humidité du sol (Soil Moisture V1.2) et déclenchant l'arrosage selon un seuil calibré, dès la fin du prototype ; (2) adapter le système aux grandes surfaces en structurant les capteurs par blocs de 4 sur des modules de 1,70 m × 1,20 m, d'ici la version 2 ; (3) étudier les besoins en eau et en température d'au moins 6 variétés (carotte, pomme de terre, oignon, salade, tomate, etc.) et les traduire en algorithmes ; (4) obtenir une autonomie énergétique minimale de 24h via pompe 12-24V DC et alimentation solaire envisagée ; (5) réduire la consommation d'eau d'au moins 30% par rapport à l'arrosage manuel sur les parcelles pilotes.",
    beneficiaires:"Bénéficiaires directs : petits et moyens agriculteurs, coopératives agricoles, maraîchers, jardins communautaires. Bénéficiaires indirects : familles rurales (sécurité alimentaire), consommateurs urbains (prix), collectivités locales (développement économique), étudiants et techniciens formés au projet.",
    realisations:"Étapes déjà réalisées : (1) conception d'une version réduite d'IRRITECH par l'équipe AFRICA.TECH21 ; (2) choix de la carte ESP32 (15-18 ADC, résolution 12 bits, contrôle jusqu'à 4 blocs) ; (3) sélection des capteurs Soil Moisture V1.2 avec revêtement résine et gaine d'isolation ; (4) définition du capteur DHT22 en complémentarité ; (5) rédaction du code MicroPython sous Thonny (moyenne pondérée des 4 capteurs, condition d'arrosage sous seuil 1500) ; (6) identification des contraintes terrain (protection contre l'humidité, stabilité du sol, poussière, sable, températures extrêmes). À venir : prototypage terrain, calibration par variété, industrialisation.",
    partenaires:"Partenaires techniques envisagés : coopératives agricoles locales, écoles d'agronomie, laboratoires d'électronique, ONG de développement rural. Partenaires financiers recherchés : fonds d'investissement agricole, bailleurs sensibles à la souveraineté alimentaire, programmes climat.",
    budget:"",
    benefice_financeur:"Pour le financeur : (1) impact direct sur la sécurité alimentaire et la souveraineté agricole africaine ; (2) projet aligné sur les ODD 2 (faim zéro), 6 (eau propre) et 13 (climat) ; (3) potentiel de scalabilité vers des centaines d'exploitations ; (4) visibilité forte sur un projet technologique innovant made in Africa ; (5) économies d'eau mesurables, argument RSE puissant ; (6) création d'emplois locaux (techniciens d'installation et de maintenance)."

{
    id:'mk40',
    titre:'MK-40 — Couveuse automatique intelligente',
    contexte:"L'élevage de volaille est une activité économique majeure en Afrique de l'Ouest. La couvaison naturelle est lente, aléatoire et dépend fortement des conditions climatiques. Les éleveurs ont besoin d'outils fiables pour automatiser la couvaison et améliorer les taux d'éclosion. MK-40, successeur de la MK08 conçue par AFRICA.TECH21, est une couveuse automatique intelligente qui recrée les conditions de couvaison naturelle (température, humidité, retournement) avec un haut niveau de précision. Elle s'adresse aux éleveurs professionnels, aux coopératives et aux projets d'insertion.",
    probleme:"Les éleveurs de volaille africains font face à : (1) des taux d'éclosion faibles (souvent < 50%) dus à un contrôle imprécis de la température et de l'humidité ; (2) des pertes importantes d'œufs par méconnaissance du bon moment du mirage ; (3) des couveuses importées chères, peu fiables et impossibles à réparer localement ; (4) l'absence de mécanismes de retournement automatique, ce qui oblige à une surveillance humaine constante ; (5) un climat chaud qui complique la régulation thermique (surtout au Sénégal) ; (6) le manque de traçabilité du nombre de jours d'incubation. Conséquences : pertes économiques pour les éleveurs, dépendance aux importations, faible productivité du secteur avicole. Population affectée : éleveurs de volaille, coopératives, jeunes en insertion, ménages ruraux.",
    objectifs:"Objectif général : fournir une couveuse automatique intelligente, fiable et locale, capable d'améliorer significativement les taux d'éclosion. Objectifs spécifiques (SMART) : (1) intégrer un capteur TMP117 pour une mesure de température ultra-précise ; (2) doubler la mesure d'humidité avec SHT30 + BME280 pour une redondance et une moyenne arithmétique ; (3) automatiser le retournement des œufs (3 à 5 fois/jour du 3e au 18e/19e jour) via moteur pas-à-pas ; (4) intégrer un module RTC DS3231 pour afficher le nombre de jours d'incubation ; (5) intégrer une ESP32-CAM pour le mirage automatisé et le suivi photo ; (6) offrir une interface tactile 3,5 pouces pour modifier les paramètres en temps réel ; (7) atteindre un taux d'éclosion ≥ 80% sur les œufs fécondés en conditions pilotes.",
    beneficiaires:"Bénéficiaires directs : éleveurs de volaille (poules, cailles, canards, oies), coopératives avicoles, jeunes entrepreneurs agricoles. Bénéficiaires indirects : ménages ruraux et urbains (accès à la protéine animale), vétérinaires, techniciens formés, filière avicole nationale.",
    realisations:"Étapes déjà réalisées : (1) retour d'expérience MK08 et identification des points faibles (DHT22 remplacé par TMP117) ; (2) sélection complète des composants (TMP117, SHT30, BME280, ESP32-CAM, RTC DS3231, écran TFT 3,5\", minuterie T3230, thermostat, lampe 12V, ventilateur 220V, moteur pas-à-pas, alvéoles modulables) ; (3) conception du schéma de fonctionnement autour d'ARDUINO UNO ; (4) plan de la couveuse conçu par le MAJOR DIAO ; (5) définition des cycles de retournement. À venir : prototypage, tests d'éclosion, validation terrain.",
    partenaires:"Partenaires techniques : écoles vétérinaires, coopératives avicoles, laboratoires d'électronique. Partenaires financiers recherchés : bailleurs du secteur agricole, programmes d'insertion des jeunes, fonds d'innovation technologique.",
    budget:"",
    benefice_financeur:"Pour le financeur : (1) impact direct sur la souveraineté alimentaire (protéine animale) ; (2) ODD 1 (pauvreté), 2 (faim zéro), 8 (travail décent) ; (3) potentiel de déploiement rapide auprès de milliers d'éleveurs ; (4) visibilité sur un produit technologique made in Africa ; (5) création d'emplois locaux dans la fabrication et la maintenance ; (6) modèle économique viable (vente + maintenance + consommables)."
},
{
    id:'oxy',
    titre:'Projet OXY — Système d\'assistance respiratoire automatique',
    contexte:"Dans de nombreux hôpitaux africains, les ventilateurs mécaniques sont rares, coûteux et dépendent de pièces importées. Lors de crises sanitaires (COVID-19, grippe sévère, SDRA), les services de réanimation sont saturés et les patients décèdent faute d'assistance respiratoire. Le Projet OXY vise à concevoir un système d'assistance respiratoire automatique, robuste et réparable localement, à partir d'un ballon Ambu compressé par un bras motorisé. Il est destiné aux hôpitaux, cliniques, centres de santé et situations d'urgence.",
    probleme:"Les systèmes de santé africains font face à : (1) une pénurie critique de ventilateurs mécaniques dans les services de réanimation ; (2) des équipements importés coûteux (plusieurs millions FCFA), souvent hors service faute de pièces ; (3) une dépendance totale aux chaînes d'approvisionnement internationales, rompues en période de crise ; (4) l'absence de solutions adaptées aux réalités locales (coupures électriques, poussière, température, personnel peu formé) ; (5) une mortalité élevée des patients atteints d'insuffisance respiratoire aiguë (SDRA, AVC, SLA, Guillain-Barré, traumatismes, prématurés, pneumonies sévères). Conséquences : décès évitables, saturation des services, inégalités d'accès aux soins. Population affectée : patients en détresse respiratoire, personnel soignant, hôpitaux publics et privés.",
    objectifs:"Objectif général : concevoir un système d'assistance respiratoire automatique, sûr, fiable et réparable localement, couvrant un large spectre de pathologies. Objectifs spécifiques (SMART) : (1) automatiser la compression d'un ballon Ambu via moteur NEMA23 + driver TB6600 piloté par ESP32 ; (2) intégrer une base de données médicale sur carte MicroSD avec paramètres par maladie (volume courant, fréquence, PEP) ; (3) offrir une interface tactile 3,5\" ILI9488 compatible gants médicaux ; (4) assurer une redondance mécanique via boutons industriels IP67 et un E-STOP ; (5) intégrer monitoring temps réel (MPXV7002DP pression, SFM3000 débit, MAX30102 SpO2, DS18B20 température, INA219 courant) ; (6) garantir une autonomie de 4h via batterie Li-ion + basculement automatique secteur/batterie ; (7) valider le dispositif en conditions simulées avec un comité médical.",
    beneficiaires:"Bénéficiaires directs : patients en détresse respiratoire (SDRA, AVC, SLA, Guillain-Barré, myasthénie, traumatismes, prématurés, bronchiolites, pneumonies, sepsis), hôpitaux, cliniques, centres de santé. Bénéficiaires indirects : personnel soignant (moins de charge), familles, système de santé national, ingénieurs biomédicaux formés.",
    realisations:"Étapes déjà réalisées : (1) étude médicale complète des pathologies prises en charge (7 familles documentées) ; (2) sélection des composants (NEMA23, TB6600, ESP32, écran TFT ILI9488, MPXV7002DP, MAX30102, SFM3000, DS3231, TPL5110, LM2596, INA219, DS18B20, filtre HEPA, ballon Ambu ISO 10651-4, circuit 22mm) ; (3) architecture système (base de données médicale sur MicroSD, interface tactile, redondance mécanique, E-STOP, watchdog) ; (4) définition des paramètres ventilatoires par pathologie ; (5) conception mécanique préliminaire (boîtier plexiglas transparent, accès maintenance). À venir : prototypage, tests avec comité médical, certification.",
    partenaires:"Partenaires techniques : hôpitaux universitaires, écoles de médecine, ingénierie biomédicale, laboratoires d'électronique. Partenaires financiers recherchés : ministères de la Santé, OMS, UNICEF, fonds d'innovation médicale, ONG santé.",
    budget:"",
    benefice_financeur:"Pour le financeur : (1) impact sanitaire direct et mesurable (vies sauvées) ; (2) ODD 3 (santé et bien-être) ; (3) souveraineté sanitaire africaine (production locale de dispositifs médicaux) ; (4) visibilité forte sur un projet à fort impact social ; (5) potentiel d'exportation vers d'autres pays africains ; (6) alignement avec les politiques nationales de santé."
},
{
    id:'qualiwash',
    titre:'QUALIWASH — Mini machines à laver locales',
    contexte:"Le marché africain des machines à laver est dominé par des produits importés, souvent de qualité douteuse et à des prix prohibitifs. De nombreux foyers n'ont pas accès à des équipements fiables, et les arnaques sur la qualité des appareils sont fréquentes. AFRICA.TECH21 propose QUALIWASH : une mini machine à laver conçue et fabriquée localement, avec un design sphérique innovant, des ailettes en silicone et un rapport qualité/prix transparent. Le projet s'inscrit dans une démarche de souveraineté technologique africaine.",
    probleme:"Le marché africain du lavage domestique fait face à : (1) des machines importées chères, souvent de qualité médiocre, avec des pannes fréquentes et des pièces introuvables ; (2) des arnaques récurrentes sur la qualité réelle des appareils (puissance, capacité, durabilité) ; (3) l'absence de production locale, ce qui empêche toute maîtrise technologique et toute réparation abordable ; (4) un design inadapté aux réalités locales (volumes, formes, habitudes) ; (5) un coût total de possession élevé pour les ménages modestes. Conséquences : dépenses inutiles, dépendance aux importations, frustration des consommateurs, perte de devises. Population affectée : ménages urbains et périurbains, jeunes actifs, petites structures (salons de coiffure, restaurants, cliniques).",
    objectifs:"Objectif général : concevoir et produire localement une mini machine à laver fiable, performante et abordable, adaptée aux besoins réels des foyers africains. Objectifs spécifiques (SMART) : (1) analyser la machine existante et établir un benchmark complet (dimensions, volumes, consommation) ; (2) dimensionner un design sphérique avec ailettes en silicone ; (3) respecter les normes des machines à laver (sécurité, étanchéité, bruit) ; (4) atteindre un coût de production ≤ 50 000 FCFA maximum ; (5) garantir une transparence totale sur le rapport qualité/prix (fin des arnaques) ; (6) industrialiser une première série pilote d'au moins 20 unités.",
    beneficiaires:"Bénéficiaires directs : ménages urbains et périurbains, jeunes actifs, petites structures professionnelles (salons de coiffure, restaurants, cliniques, hôtels). Bénéficiaires indirects : réparateurs locaux, distributeurs, filière de fabrication locale, économie nationale (réduction des importations).",
    realisations:"Étapes déjà réalisées : (1) analyse de la machine existante ; (2) décision d'un design sphérique avec ailettes en silicone (flexibilité, durabilité, résistance à l'eau) ; (3) définition du budget cible (≤ 50 000 FCFA) ; (4) identification des priorités (composants essentiels d'abord) ; (5) vision de souveraineté technologique. À venir : dimensionnement complet, prototypage, tests de durabilité, série pilote.",
    partenaires:"Partenaires techniques : ateliers de fabrication mécanique, laboratoires matériaux, écoles d'ingénieurs. Partenaires financiers recherchés : fonds d'innovation industrielle, bailleurs PME, programmes d'appui à l'artisanat et à l'industrie locale.",
    budget:"Budget cible : 50 000 FCFA maximum (à affiner par le responsable finance).",
    benefice_financeur:"Pour le financeur : (1) souveraineté technologique africaine ; (2) ODD 8 (travail décent), 9 (industrie), 12 (consommation responsable) ; (3) impact social fort (fin des arnaques, accès à un produit fiable) ; (4) création d'emplois locaux (fabrication, distribution, maintenance) ; (5) potentiel de réplication dans plusieurs pays africains ; (6) visibilité sur un produit innovant au design unique."
},
{
    id:'rga',
    titre:'RGA — Robot de guide et assistance',
    contexte:"Les universités, hôpitaux et grandes infrastructures africaines accueillent chaque jour des milliers de visiteurs qui peinent à s'orienter. Les agents d'accueil sont en nombre insuffisant, et les panneaux d'information ne suffisent pas. AFRICA.TECH21 propose RGA : un robot autonome intelligent capable d'accueillir, de reconnaître et de guider les visiteurs. Ce projet pionnier vise à développer les compétences locales en robotique et à créer une solution adaptée aux besoins spécifiques des infrastructures africaines.",
    probleme:"Les grandes infrastructures africaines (universités, hôpitaux, administrations) font face à : (1) un déficit d'accueil humain (files d'attente, orientation difficile, visiteurs perdus) ; (2) l'absence de solutions robotiques locales, ce qui oblige à importer des systèmes étrangers inadaptés et coûteux ; (3) un manque de compétences locales en robotique, IA et systèmes embarqués ; (4) une expérience visiteur dégradée (stress, perte de temps, mauvaise image de l'institution) ; (5) un besoin croissant d'automatisation dans un contexte de pression budgétaire. Conséquences : perte de temps, insatisfaction des usagers, image dégradée, retard technologique. Population affectée : étudiants, patients, visiteurs, personnel administratif.",
    objectifs:"Objectif général : développer un robot autonome intelligent d'accueil et de guidage, adapté aux infrastructures africaines. Objectifs spécifiques (SMART) : (1) intégrer une reconnaissance faciale via Pi Camera Module 3 et Deep Learning pour distinguer étudiants / personnel / visiteurs ; (2) assurer une navigation autonome avec évitement d'obstacles ; (3) offrir une interface vocale interactive ; (4) embarquer un écran HDMI pour l'affichage d'informations ; (5) utiliser un Raspberry Pi 5 8GB comme cerveau ; (6) garantir une autonomie minimale de 4h via batterie LiPo 12-24V ; (7) valider le prototype dans au moins 2 environnements réels (université + hôpital).",
    beneficiaires:"Bénéficiaires directs : étudiants, patients, visiteurs, personnel administratif et d'accueil. Bénéficiaires indirects : institutions (image modernisée), étudiants en robotique et IA (formation), écosystème tech local (sous-traitance, fournisseurs).",
    realisations:"Étapes déjà réalisées : (1) définition des fonctionnalités (reconnaissance faciale, navigation autonome, interface vocale, IA) ; (2) sélection des composants (Raspberry Pi 5 8GB, Pi Camera Module 3, moteurs RS-550 12V, driver TB6612FNG, batterie LiPo 12-24V, roues caoutchouc, écran HDMI, haut-parleurs USB, refroidissement, châssis bois/fer + forex) ; (3) architecture électronique validée (choix du TB6612FNG pour son rendement >90% et sa faible chauffe) ; (4) conception mécanique (2 roues motrices + 2 directrices) ; (5) feuille de route logicielle (Python, TensorFlow, OpenCV, TTS, algorithmes de navigation). À venir : prototypage, entraînement IA, tests terrain.",
    partenaires:"Partenaires techniques : universités, hôpitaux pilotes, laboratoires de robotique, écoles d'ingénieurs. Partenaires financiers recherchés : ministères de l'Enseignement supérieur et de la Santé, fonds d'innovation, bailleurs tech.",
    budget:"",
    benefice_financeur:"Pour le financeur : (1) projet emblématique de robotique africaine ; (2) ODD 4 (éducation), 9 (industrie et innovation), 11 (villes durables) ; (3) visibilité médiatique forte (premier robot guide africain) ; (4) création d'une filière robotique locale ; (5) impact direct sur l'expérience des usagers ; (6) potentiel d'exportation."

{
    id:'sagaf',
    titre:'SAGAF — Système d\'alerte pour fuite de gaz',
    contexte:"Les explosions de gaz domestique causent chaque année des centaines de victimes et des dégâts matériels considérables en Afrique. De par l'imprudence des individus et l'absence de dispositifs de sécurité accessibles, des catastrophes surviennent régulièrement dans les foyers, les restaurants et les petits commerces. AFRICA.TECH21 propose SAGAF : un système d'alerte pour fuite de gaz, compact, abordable et facile à installer, destiné à protéger les foyers et les lieux à risque.",
    probleme:"La sécurité gaz domestique en Afrique est un enjeu majeur de santé publique : (1) les fuites de gaz ne sont pas détectées à temps, ce qui entraîne des explosions parfois mortelles ; (2) les détecteurs disponibles sur le marché sont chers, importés et peu fiables ; (3) les utilisateurs n'ont aucune alerte précoce, et l'odeur seule ne suffit pas à prévenir un drame ; (4) les foyers, restaurants, petits commerces et écoles sont exposés sans protection ; (5) il n'existe pas de solution locale, adaptée et réparable. Conséquences : pertes en vies humaines, brûlures graves, dégâts matériels, traumatismes. Population affectée : ménages, restaurants, petits commerces, écoles, lieux publics.",
    objectifs:"Objectif général : concevoir un système d'alerte précoce pour fuite de gaz, compact, fiable et abordable, destiné aux foyers et lieux à risque. Objectifs spécifiques (SMART) : (1) détecter les fuites via capteur MQ-2 (GPL, propane, méthane, fumée) ; (2) doubler la détection avec MQ-4 ou MQ-5 pour le butane ; (3) alerter via buzzer (80-95 dB) et LEDS bleues ; (4) intégrer un microcontrôleur ESP32 (WiFi + Bluetooth) ; (5) compacter le système dans un boîtier type smartphone avec batterie rechargeable 5V ; (6) préparer une version avec envoi de SMS via module GSM SIM800L ; (7) valider la fiabilité sur au moins 50 foyers pilotes.",

// ============ ÉTAT ============
let redactionEnCours = null;
let recListening = false;
let recognition = null;

// ============ VOIX ============
const synth = window.speechSynthesis;
let chosenVoice = null;

function pickVoice(){
    const voices = synth.getVoices();
    if (!voices || !voices.length) return;
    const fr = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (!fr.length) return;
    const priority = ['natural','neural','google','microsoft','amelie','amélie','thomas','audrey','marie','julie'];
    let best = fr[0], bestScore = -1;
    for (const v of fr){
        const n = (v.name||'').toLowerCase();
        let s = 0;
        priority.forEach((k,i)=>{ if(n.includes(k)) s += (priority.length-i)*10; });
        if ((v.lang||'').toLowerCase()==='fr-fr') s += 5;
        if (n.includes('compact')||n.includes('espeak')) s -= 20;
        if (s > bestScore){ bestScore = s; best = v; }
    }
    chosenVoice = best;
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;
pickVoice();

function speak(text){
    if (!text) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (chosenVoice){ u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    else u.lang = 'fr-FR';
    u.rate = 1; u.pitch = 1; u.volume = 1;
    synth.speak(u);
    showVoiceStatus(text);
}
function showVoiceStatus(text){
    const el = document.getElementById('voiceStatus');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=>el.classList.remove('show'), 5000);
}

// ============ RECONNAISSANCE ============
function initRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ alert('Reconnaissance vocale non supportée par ce navigateur.'); return false; }
    recognition = new SR();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (e)=>{
        const txt = e.results[0][0].transcript.toLowerCase().trim();
        showVoiceStatus('🎤 « ' + txt + ' »');
        traiterCommande(txt);
    };
    recognition.onerror = (e)=>{
        recListening = false;
        document.getElementById('btnVoice').classList.remove('active');
        if (e.error !== 'no-speech') showVoiceStatus('❌ Erreur micro : ' + e.error);
    };
    recognition.onend = ()=>{
        recListening = false;
        document.getElementById('btnVoice').classList.remove('active');
    };
    return true;
}
function toggleVoice(){
    if (!recognition && !initRecognition()) return;
    const btn = document.getElementById('btnVoice');
    if (recListening){
        recognition.stop(); recListening = false;
        btn.classList.remove('active');
        speak('Commande vocale arrêtée.');
    } else {
        try { recognition.start(); recListening = true; btn.classList.add('active'); speak('Je vous écoute.'); }
        catch(e){ console.warn(e); }
    }
}
function traiterCommande(cmd){
    if (cmd.includes('nouveau projet') || cmd.includes('créer') || cmd.includes('nouvelle rédaction')){ nouveauProjet(); }
    else if (cmd.includes('enregistrer') || cmd.includes('sauvegarder')){ sauvegarderProjet(); }
    else if (cmd.includes('vérifier') || cmd.includes('verifier')){ verifierDocument(); }
    else if (cmd.includes('pdf') || cmd.includes('télécharger')){ telechargerPDF(); }
    else if (cmd.includes('retour') || cmd.includes('liste')){ retourListe(); }
    else if (cmd.includes('lire') || cmd.includes('lis')){ lireDocument(); }
    else { speak('Commande non reconnue. Dites : nouveau projet, enregistrer, vérifier, PDF, retour, lire.'); }
}

async function chargerListe(){
    const grid = document.getElementById('gridRedactions');
    try {
        const { data, error } = await supabaseClient
            .from('redaction_projets')
            .select('*')
            .order('updated_at', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0){
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-file-alt"></i>Aucune rédaction encore. Cliquez sur « Nouveau projet » ou sur un projet source ci-dessous.</div>`;
            return;
        }
        grid.innerHTML = '';
        data.forEach(r => {
            const div = document.createElement('div');
            div.className = 'card-redaction';
            div.onclick = () => ouvrirRedaction(r);
            const dt = new Date(r.updated_at || r.created_at).toLocaleDateString('fr-FR');
            div.innerHTML = `
                <span class="badge-source">${escapeHtml(r.projet_source || 'LIBRE')}</span>
                <span class="badge-statut">${escapeHtml((r.statut || 'brouillon').toUpperCase())}</span>
                <h3>${escapeHtml(r.titre || '(sans titre)')}</h3>
                <p>${escapeHtml((r.contexte || '').slice(0,110))}${(r.contexte||'').length>110?'…':''}</p>
                <div class="meta">
                    <span><i class="fas fa-user"></i> ${escapeHtml(r.created_by||'')}</span>
                    <span><i class="fas fa-clock"></i> ${dt}</span>
                </div>`;
            grid.appendChild(div);
        });
    } catch (e){
        grid.innerHTML = `<div class="empty-state" style="color:#ff4757;"><i class="fas fa-exclamation-triangle"></i>Erreur chargement : ${escapeHtml(e.message)}</div>`;
    }
}

// ============ FORMULAIRE ============
function nouveauProjet(sourceId){
    const source = sourceId ? PROJETS_SOURCES.find(x => x.id === sourceId) : null;

    redactionEnCours = {
        id: null,
        projet_source: sourceId || '',
        titre: source ? source.titre : '',
        contexte: source ? source.contexte : '',
        probleme: source ? source.probleme : '',
        objectifs: source ? source.objectifs : '',
        beneficiaires: source ? source.beneficiaires : '',
        realisations: source ? source.realisations : '',
        partenaires: source ? source.partenaires : '',
        budget: source ? source.budget : '',
        benefice_financeur: source ? source.benefice_financeur : '',
        statut: 'brouillon'
    };

    document.getElementById('formTitle').textContent =
        source ? 'Édition : ' + source.titre : 'Nouvelle rédaction';

    remplirFormulaire(redactionEnCours);
    document.getElementById('listSection').style.display = 'none';
    document.getElementById('formSection').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    speak(source
        ? 'Formulaire pré-rempli à partir du projet ' + source.titre + '. Vérifiez les sections puis enregistrez.'
        : 'Formulaire vide. Remplissez les sections obligatoires : contexte, problème, objectifs.');
}

function ouvrirRedaction(r){
    redactionEnCours = { ...r };
    document.getElementById('formTitle').textContent = 'Édition : ' + (r.titre || '');
    remplirFormulaire(r);
    document.getElementById('listSection').style.display = 'none';
    document.getElementById('formSection').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    speak('Rédactions ouverte.');
}

function remplirFormulaire(r){
    document.getElementById('fProjetSource').value = r.projet_source || '';
    document.getElementById('fTitre').value = r.titre || '';
    document.getElementById('fContexte').value = r.contexte || '';
    document.getElementById('fProbleme').value = r.probleme || '';
    document.getElementById('fObjectifs').value = r.objectifs || '';
    document.getElementById('fBeneficiaires').value = r.beneficiaires || '';
    document.getElementById('fRealisations').value = r.realisations || '';
    document.getElementById('fPartenaires').value = r.partenaires || '';
    document.getElementById('fBudget').value = r.budget || '';
    document.getElementById('fBeneficeFinanceur').value = r.benefice_financeur || '';
}

function onSourceChange(){
    const sid = document.getElementById('fProjetSource').value;
    if (!sid) return;
    const p = PROJETS_SOURCES.find(x => x.id === sid);
    if (!p) return;
    const mapping = {
        titre:'fTitre', contexte:'fContexte', probleme:'fProbleme', objectifs:'fObjectifs',
        beneficiaires:'fBeneficiaires', realisations:'fRealisations', partenaires:'fPartenaires',
        budget:'fBudget', benefice_financeur:'fBeneficeFinanceur'
    };
    Object.keys(mapping).forEach(k => {
        const el = document.getElementById(mapping[k]);
        if (el && !el.value.trim() && p[k]) el.value = p[k];
    });
    speak('Pré-remplissage effectué à partir du projet sélectionné.');
}

function retourListe(){
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('listSection').style.display = 'block';
    redactionEnCours = null;
    chargerListe();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function sauvegarderProjet(){
    if (!redactionEnCours) return;
    const titre = document.getElementById('fTitre').value.trim();
    if (!titre){
        alert('Le titre est obligatoire.'); speak('Attention, le titre est obligatoire.'); return;
    }
    const payload = {
        projet_source: document.getElementById('fProjetSource').value || null,
        titre: titre,
        contexte: document.getElementById('fContexte').value.trim(),
        probleme: document.getElementById('fProbleme').value.trim(),
        objectifs: document.getElementById('fObjectifs').value.trim(),
        beneficiaires: document.getElementById('fBeneficiaires').value.trim(),
        realisations: document.getElementById('fRealisations').value.trim(),
        partenaires: document.getElementById('fPartenaires').value.trim(),
        budget: document.getElementById('fBudget').value.trim(),
        benefice_financeur: document.getElementById('fBeneficeFinanceur').value.trim(),
        statut: 'brouillon',
        created_by: (memberPrenom + ' ' + memberNom).trim()
    };
    try {
        let result;
        if (redactionEnCours.id){
            result = await supabaseClient.from('redaction_projets').update(payload).eq('id', redactionEnCours.id).select().single();
        } else {
            result = await supabaseClient.from('redaction_projets').insert(payload).select().single();
        }
        if (result.error) throw result.error;
        redactionEnCours = { ...result.data };
        speak('Rédactions enregistrée avec succès.');
        showVoiceStatus('✅ Enregistré');
    } catch (e){
        alert('Erreur sauvegarde : ' + e.message);
        speak('Erreur lors de l\'enregistrement.');
    }
}

function verifierDocument(){
    const checks = [
        { id:'fTitre', label:'Titre', required:true },
        { id:'fContexte', label:'Contexte', required:true },
        { id:'fProbleme', label:'Étude du problème', required:true },
        { id:'fObjectifs', label:'Objectifs', required:true },
        { id:'fBeneficiaires', label:'Bénéficiaires', required:false },
        { id:'fRealisations', label:'Réalisations', required:false },
        { id:'fPartenaires', label:'Partenaires', required:false },
        { id:'fBudget', label:'Budget', required:false },
        { id:'fBeneficeFinanceur', label:'Bénéfice pour le financeur', required:false }
    ];
    const manquants = [];
    checks.forEach(c => {
        const v = (document.getElementById(c.id).value || '').trim();
        if (!v) manquants.push({ label: c.label, required: c.required });
    });
    if (manquants.length === 0){
        const msg = 'Toutes les sections sont remplies. Le document semble complet.';
        speak(msg); showVoiceStatus('✅ ' + msg); return;
    }
    const req = manquants.filter(m => m.required).map(m => m.label);
    const opt = manquants.filter(m => !m.required).map(m => m.label);
    let phrase = '';
    if (req.length) phrase += 'Sections obligatoires manquantes : ' + req.join(', ') + '. ';
    if (opt.length) phrase += 'Sections optionnelles non remplies : ' + opt.join(', ') + '.';
    speak(phrase); showVoiceStatus('⚠️ ' + phrase);
}

function lireDocument(){
    if (!redactionEnCours) return;
    const parts = [
        document.getElementById('fTitre').value,
        document.getElementById('fContexte').value,
        document.getElementById('fProbleme').value,
        document.getElementById('fObjectifs').value,
        document.getElementById('fBeneficiaires').value,
        document.getElementById('fRealisations').value,
        document.getElementById('fPartenaires').value,
        document.getElementById('fBudget').value,
        document.getElementById('fBeneficeFinanceur').value
    ].filter(Boolean);
    synth.cancel();
    speak(parts.join('. '));
}

function telechargerPDF(){
    if (!redactionEnCours){
        alert('Aucune rédaction ouverte.');
        return;
    }
    // Récupérer les valeurs actuelles
    const titre = document.getElementById('fTitre').value.trim() || '(sans titre)';
    const source = document.getElementById('fProjetSource').value || 'libre';
    const sections = [
        { num:'01', title:'CONTEXTE',               text: document.getElementById('fContexte').value },
        { num:'02', title:'ÉTUDE DU PROBLÈME',      text: document.getElementById('fProbleme').value },
        { num:'03', title:'OBJECTIFS (SMART)',      text: document.getElementById('fObjectifs').value },
        { num:'04', title:'BÉNÉFICIAIRES',          text: document.getElementById('fBeneficiaires').value },
        { num:'05', title:'RÉALISATIONS / ACTIVITÉS',text: document.getElementById('fRealisations').value },
        { num:'06', title:'PARTENAIRES',             text: document.getElementById('fPartenaires').value },
        { num:'07', title:'BUDGET / FINANCEMENT',   text: document.getElementById('fBudget').value },
        { num:'08', title:'BÉNÉFICE POUR LE FINANCEUR', text: document.getElementById('fBeneficeFinanceur').value }
    ];

    const auteur = (memberPrenom + ' ' + memberNom).trim() || 'Direction AFRICA.TECH21';
    const dateStr = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });

    // Construction du HTML du PDF
    let html = '';

    // --- COUVERTURE ---
    html += `
    <div class="pdf-cover">
        <div class="logo">AFRICA.TECH21<small>COMMUNAUTÉ TECHNOLOGIQUE AFRICAINE</small></div>
        <h1>${escapeHtml(titre)}</h1>
        <div class="sub">Dossier de projet — Document destiné aux financeurs</div>
        <div class="meta-block">
            <div><strong>Projet source :</strong> ${escapeHtml(source.toUpperCase())}</div>
            <div><strong>Rédacteur :</strong> ${escapeHtml(auteur)}</div>
            <div><strong>Date :</strong> ${escapeHtml(dateStr)}</div>
            <div><strong>Référence :</strong> AFRICA.TECH21 / RP-${Date.now().toString().slice(-6)}</div>
            <div><strong>Statut :</strong> BROUILLON</div>
        </div>
        <div class="footer-cover">Document confidentiel — AFRICA.TECH21 © ${new Date().getFullYear()}</div>
    </div>`;

    // --- SECTIONS ---
    sections.forEach(s => {
        const txt = (s.text || '').trim();
        html += `
        <div class="pdf-section">
            <div class="pdf-section-title">
                <span class="pdf-section-num">${s.num}</span>${escapeHtml(s.title)}
            </div>
            ${txt
                ? `<div class="pdf-text">${escapeHtml(txt)}</div>`
                : `<div class="pdf-empty">Section non renseignée — à compléter.</div>`}
        </div>`;
    });

    // --- SIGNATURES ---
    html += `
    <div class="pdf-signature-block">
        <div class="pdf-signature">
            <div class="role">LE RÉDACTEUR</div>
            <div class="name">${escapeHtml(auteur)}</div>
            <div class="line"></div>
            <div class="label">Signature</div>
        </div>
        <div class="pdf-signature">
            <div class="role">LE RESPONSABLE FINANCE</div>
            <div class="name">&nbsp;</div>
            <div class="line"></div>
            <div class="label">Signature</div>
        </div>
    </div>

    <div class="pdf-footer">
        <div>AFRICA.TECH21 — ${escapeHtml(titre)}</div>
        <div class="page-num">Rédigé par ${escapeHtml(auteur)} — ${escapeHtml(dateStr)}</div>
    </div>`;

    // Injecter dans le conteneur PDF et déclencher impression
    const pdfEl = document.getElementById('pdfDocument');
    pdfEl.innerHTML = html;

    // Attendre le rendu puis lancer l'impression
    setTimeout(() => {
        window.print();
    }, 250);
}

function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('load', () => {

    chargerSources();
    setTimeout(()=>{
        speak('Bienvenue dans l\'espace rédaction projet. Cliquez sur un projet source pour ouvrir une rédaction pré-remplie.');
    }, 800);
});
window.addEventListener('beforeunload', ()=> synth.cancel());
