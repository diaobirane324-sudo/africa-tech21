<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport de Fin de Journée | AFRICA.TECH21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
        :root {
            --neon-blue: #00f0ff; --neon-green: #00ff88; --neon-purple: #7b2cbf; --neon-pink: #ff00ff;
            --dark-space: #0a0a12; --deep-space: #050510; --text-primary: #ffffff;
            --text-secondary: #a0a8c0; --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1); --panel-glow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        body { background: linear-gradient(135deg, var(--deep-space) 0%, var(--dark-space) 50%, #0f0f1f 100%); color: var(--text-primary); min-height: 100vh; padding: 2rem; }
        .back-btn { display: inline-block; padding: 0.8rem 2rem; margin-bottom: 2rem; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon-blue); border-radius: 10px; color: var(--neon-blue); text-decoration: none; font-weight: 600; }
        .page-container { max-width: 1000px; margin: 0 auto; }
        .page-header { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 2.5rem; margin-bottom: 2rem; text-align: center; box-shadow: var(--panel-glow); }
        .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; background: linear-gradient(45deg, var(--neon-blue), var(--neon-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 2rem; margin-bottom: 2rem; box-shadow: var(--panel-glow); }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-blue); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .section-title i { color: var(--neon-green); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .info-box { background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 12px; padding: 1rem; }
        .info-box .label { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.3rem; }
        .info-box .value { color: var(--neon-green); font-weight: 700; font-size: 1.1rem; font-family: 'Orbitron', sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: var(--neon-blue); font-weight: 600; margin-bottom: 0.5rem; }
        .form-group select, .form-group textarea { width: 100%; padding: 1rem 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1rem; outline: none; }
        .form-group select option { background: var(--dark-space); }
        .form-group textarea { resize: vertical; min-height: 200px; font-family: 'Exo 2', sans-serif; }
        .btn-primary { padding: 1rem 2rem; background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue)); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; }
        .btn-secondary { padding: 1rem 2rem; background: rgba(0,240,255,0.1); border: 1px solid var(--neon-blue); border-radius: 12px; color: var(--neon-blue); font-weight: 700; cursor: pointer; }
        .btn-container { display: flex; gap: 1rem; flex-wrap: wrap; }
        .rapport-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .rapport-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem; }
        .rapport-date { color: var(--neon-blue); font-weight: 700; font-family: 'Orbitron', sans-serif; }
        .rapport-objet { display: inline-block; padding: 0.3rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: rgba(0,240,255,0.15); color: var(--neon-blue); }
        .rapport-auteur { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .rapport-contenu { color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; }
        .btn-action { padding: 0.4rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-edit { background: rgba(0,240,255,0.1); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .btn-delete { background: rgba(255,71,87,0.1); color: #ff4757; border: 1px solid #ff4757; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0a0a12; border: 1px solid var(--glass-border); border-radius: 25px; max-width: 500px; width: 90%; padding: 2.5rem; text-align: center; }
        .modal-content h2 { color: var(--neon-blue); margin-bottom: 1.5rem; }
        .modal-content input { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1.1rem; text-align: center; margin-bottom: 1.5rem; }
        .error-msg { color: #ff4757; margin-bottom: 1rem; display: none; }
        .toast-message { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: rgba(0,255,136,0.95); color: #050510; padding: 1rem 2rem; border-radius: 12px; font-weight: 700; z-index: 9999; }
        .toast-message.error { background: rgba(255,71,87,0.95); color: white; }
        @media (max-width: 768px) { body { padding: 1rem; } .form-grid { grid-template-columns: 1fr; } .btn-container { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> RETOUR AU DASHBOARD</a>

        <header class="page-header">
            <h1><i class="fas fa-clipboard-check"></i> RAPPORT DE FIN DE JOURNÉE</h1>
            <p style="color:var(--text-secondary);">Rédigez votre rapport d'activité quotidien</p>
        </header>

        <section class="section" id="formSection" style="display:none;">
            <h2 class="section-title"><i class="fas fa-edit"></i> RÉDIGER MON RAPPORT</h2>
            <div class="form-grid">
                <div class="info-box"><div class="label">Date</div><div class="value" id="autoDate">--/--/----</div></div>
                <div class="info-box"><div class="label">Heure</div><div class="value" id="autoHeure">--:--</div></div>
                <div class="info-box"><div class="label">Nom</div><div class="value" id="autoNom">---</div></div>
                <div class="info-box"><div class="label">ID</div><div class="value" id="autoId">---</div></div>
                <div class="info-box" style="grid-column:1/-1;"><div class="label">Fonction</div><div class="value" id="autoFonction">---</div></div>
            </div>
            <div class="form-group">
                <label>Objet du rapport *</label>
                <select id="objetSelect">
                    <option value="">-- Sélectionnez --</option>
                    <option value="Réparations">🔧 Réparations</option>
                    <option value="Créations">💡 Créations</option>
                    <option value="Réaménagement du labo">🏗️ Réaménagement</option>
                    <option value="Autre">📌 Autre</option>
                    <option value="Rien à signaler">✅ Rien à signaler</option>
                </select>
            </div>
            <div class="form-group">
                <label>Contenu du rapport *</label>
                <textarea id="contenuInput" placeholder="Décrivez ce que vous avez fait..."></textarea>
            </div>
            <div class="btn-container">
                <button class="btn-primary" id="saveBtn" onclick="sauvegarderRapport()">SAUVEGARDER</button>
                <button class="btn-secondary" onclick="reinitialiserFormulaire()">RÉINITIALISER</button>
            </div>
            <input type="hidden" id="editId" value="">
        </section>

        <section class="section" id="sectionMesRapports" style="display:none;">
            <h2 class="section-title"><i class="fas fa-history"></i> MES RAPPORTS</h2>
            <div id="mesRapports"><div class="empty-state">Chargement...</div></div>
        </section>
    </div>

    <div class="modal-overlay active" id="idModal">
        <div class="modal-content">
            <h2><i class="fas fa-id-card"></i> IDENTIFICATION</h2>
            <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Entrez votre ID membre</p>
            <input type="text" id="idInput" autocomplete="off" autofocus>
            <div class="error-msg" id="idError">❌ ID non reconnu</div>
            <button class="btn-primary" onclick="verifierId()" style="width:100%;">VALIDER</button>
        </div>
    </div>

    <script type="module">
        // ==================== FIREBASE ====================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ47zcldwOYJL8s-hHQhoG45Cwf17Aiek",
            authDomain: "africa-tech21.firebaseapp.com",
            projectId: "africa-tech21",
            storageBucket: "africa-tech21.firebasestorage.app",
            messagingSenderId: "398124674829",
            appId: "1:398124674829:web:7fb2d9c282727b8de88a44"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==================== MEMBRES ====================
        const MEMBRES = {
            "AT21-001": { nom: "DIAKHATE", prenom: "ABDOU", fonction: "VICE PRÉSIDENT" },
            "AT21_0011": { nom: "MOUHAMED", prenom: "DIALLO", fonction: "RESPONSABLE DES PROJETS" },
            "AT21_0016": { nom: "DRAMÉ", prenom: "AICHA", fonction: "SECRÉTAIRE GÉNÉRAL" },
            "AT21_0021": { nom: "DIOP", prenom: "SALAMATA", fonction: "ADJOINTE SECRÉTAIRE" },
            "AT21_0026": { nom: "TOURÉ", prenom: "SOKHNA BINTOU", fonction: "ADJOINTE FINANCE/GESTIONNAIRE" },
            "AT21_0031": { nom: "WADE", prenom: "ADJA FAMA", fonction: "RESPONSABLE FINANCE" },
            "AT21_0036": { nom: "NDIAYE", prenom: "MARIE ANGÉLIQUE DABA", fonction: "RESPONSABLE COMMUNICATION" },
            "AT21_0046": { nom: "DIALLO", prenom: "MOUHAMED", fonction: "CRÉATEUR DE CONTENU" },
            "AT21_006": { nom: "BIRANE", prenom: "DIAO", fonction: "PRÉSIDENT DE LA COMMUNAUTÉ" },
            "AT21_0041": { nom: "FALL", prenom: "SEYDINA MOUHAMED", fonction: "FFAM" },
            "AT21_0052": { nom: "SALL", prenom: "ABDOURAKHMANE", fonction: "CRÉATEUR DE CONTENU OFFICIEL" },
            "AT21_0057": { nom: "SY", prenom: "MOUHAMED", fonction: "ÉQUIPE TECHNIQUE" },
            "AT21_0062": { nom: "GAYE", prenom: "IBRAHIMA", fonction: "FFAM" },
            "AT21_0071": { nom: "SY", prenom: "OUMOU SALAMATA", fonction: "FFAM" },
            "AT21_0072": { nom: "SOW", prenom: "HALIMA AS SADIYA", fonction: "FFAM" }
        };

        let membreActuel = null;
        let rapportsData = [];

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            localStorage.removeItem('rapport_memberId');
            document.getElementById('idInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifierId();
            });
        });

        function verifierId() {
            const id = document.getElementById('idInput').value.trim();
            const errorMsg = document.getElementById('idError');

            if (MEMBRES[id]) {
                membreActuel = { id: id, ...MEMBRES[id] };
                document.getElementById('idModal').classList.remove('active');
                initialiserPage();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('idInput').value = '';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }

        function initialiserPage() {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('sectionMesRapports').style.display = 'block';

            mettreAJourDateHeure();
            setInterval(mettreAJourDateHeure, 60000);

            document.getElementById('autoNom').textContent = membreActuel.prenom + ' ' + membreActuel.nom;
            document.getElementById('autoId').textContent = membreActuel.id;
            document.getElementById('autoFonction').textContent = membreActuel.fonction;

            chargerRapports();
        }

        function mettreAJourDateHeure() {
            const now = new Date();
            document.getElementById('autoDate').textContent = now.toLocaleDateString('fr-FR');
            document.getElementById('autoHeure').textContent = now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
        }

        function showToast(message, type = '') {
            const old = document.querySelector('.toast-message');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ==================== CHARGER ====================
        async function chargerRapports() {
            try {
                const querySnapshot = await getDocs(collection(db, "rapports"));
                rapportsData = [];
                querySnapshot.forEach((doc) => {
                    rapportsData.push({ id: doc.id, ...doc.data() });
                });

                const mesRapports = rapportsData.filter(r => r.memberId === membreActuel.id);
                const container = document.getElementById('mesRapports');

                if (mesRapports.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Aucun rapport pour le moment.</div>';
                    return;
                }

                mesRapports.sort((a, b) => b.timestamp - a.timestamp);
                container.innerHTML = mesRapports.map(r => `
                    <div class="rapport-item">
                        <div class="rapport-header">
                            <span class="rapport-date">📅 ${r.date} à ${r.heure}</span>
                            <span class="rapport-objet">${r.objet}</span>
                        </div>
                        <div class="rapport-auteur">👤 ${r.nom} (${r.memberId}) - ${r.fonction}</div>
                        <div class="rapport-contenu">${r.contenu}</div>
                        <div style="margin-top:0.8rem; display:flex; gap:0.5rem;">
                            <button class="btn-action btn-edit" onclick="modifierRapport('${r.id}')">Modifier</button>
                            <button class="btn-action btn-delete" onclick="supprimerRapport('${r.id}')">Supprimer</button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                document.getElementById('mesRapports').innerHTML = '<div class="empty-state">❌ Erreur : ' + error.message + '</div>';
            }
        }

        // ==================== SAUVEGARDER ====================
        window.sauvegarderRapport = async function() {
            const objet = document.getElementById('objetSelect').value;
            const contenu = document.getElementById('contenuInput').value.trim();
            const editId = document.getElementById('editId').value;

            if (!objet) { showToast('⚠️ Sélectionnez un objet.', 'error'); return; }
            if (!contenu) { showToast('⚠️ Écrivez le contenu.', 'error'); return; }

            const now = new Date();
            const data = {
                memberId: membreActuel.id,
                nom: membreActuel.prenom + ' ' + membreActuel.nom,
                fonction: membreActuel.fonction,
                date: now.toLocaleDateString('fr-FR'),
                heure: now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}),
                objet: objet,
                contenu: contenu,
                timestamp: Date.now()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "rapports", editId), data);
                    showToast('✅ Rapport modifié !');
                } else {
                    await addDoc(collection(db, "rapports"), data);
                    showToast('✅ Rapport enregistré !');
                }
                reinitialiserFormulaire();
                chargerRapports();
            } catch (error) {
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        };

        window.modifierRapport = function(id) {
            const rapport = rapportsData.find(r => r.id === id);
            if (!rapport) return;
            document.getElementById('objetSelect').value = rapport.objet;
            document.getElementById('contenuInput').value = rapport.contenu;
            document.getElementById('editId').value = id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.supprimerRapport = async function(id) {
            if (!confirm('⚠️ Supprimer ce rapport ?')) return;
            try {
                await deleteDoc(doc(db, "rapports", id));
                showToast('🗑️ Rapport supprimé.');
                chargerRapports();
            } catch (error) {
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        };

        window.reinitialiserFormulaire = function() {
            document.getElementById('objetSelect').value = '';
            document.getElementById('contenuInput').value = '';
            document.getElementById('editId').value = '';
            mettreAJourDateHeure();
        };

        window.verifierId = verifierId;
    </script>
</body>
</html>
