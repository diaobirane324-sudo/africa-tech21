<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrétariat | AFRICA.TECH21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
        :root {
            --neon-blue: #00f0ff; --neon-purple: #7b2cbf; --neon-green: #00ff88;
            --dark-space: #0a0a12; --deep-space: #050510;
            --text-primary: #ffffff; --text-secondary: #a0a8c0;
            --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1);
            --panel-glow: 0 0 30px rgba(0,240,255,0.2);
        }
        body { background: linear-gradient(135deg, var(--deep-space) 0%, var(--dark-space) 50%, #0f0f1f 100%); color: var(--text-primary); min-height: 100vh; padding: 2rem; }
        .hologram-grid { position: fixed; top:0; left:0; width:100%; height:100%; background: linear-gradient(90deg, rgba(0,240,255,0.02) 1px, transparent 1px), linear-gradient(180deg, rgba(0,240,255,0.02) 1px, transparent 1px); background-size: 50px 50px; animation: gridScan 20s linear infinite; pointer-events: none; z-index: -2; }
        @keyframes gridScan { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        .back-btn { display: inline-block; padding: 0.8rem 2rem; margin-bottom: 2rem; background: rgba(0,240,255,0.1); border: 1px solid var(--neon-blue); border-radius: 10px; color: var(--neon-blue); text-decoration: none; font-weight: 600; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(0,240,255,0.2); box-shadow: 0 0 20px rgba(0,240,255,0.3); }
        .page-container { max-width: 1200px; margin: 0 auto; }
        .page-header { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 2.5rem; margin-bottom: 2rem; text-align: center; box-shadow: var(--panel-glow); }
        .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; background: linear-gradient(45deg, var(--neon-blue), var(--neon-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .page-header .user-info { color: var(--text-secondary); margin-top: 0.5rem; font-size: 1.1rem; }
        .section { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 2rem; margin-bottom: 2rem; box-shadow: var(--panel-glow); }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-blue); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .section-title i { color: var(--neon-green); }
        .editor-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; padding: 0.5rem; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid var(--glass-border); }
        .editor-toolbar button { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 6px; padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; }
        .editor-toolbar button:hover { background: rgba(0,240,255,0.1); border-color: var(--neon-blue); }
        #editorContent { width: 100%; min-height: 300px; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem; line-height: 1.8; resize: vertical; outline: none; }
        #editorContent:focus { border-color: var(--neon-blue); }
        .editor-actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
        .btn-primary, .btn-success, .btn-danger, .btn-warning {
            padding: 0.8rem 2rem; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue)); }
        .btn-success { background: linear-gradient(135deg, var(--neon-green), #00b894); color: #050510; }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #c0392b); }
        .btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-primary:hover, .btn-success:hover, .btn-danger:hover, .btn-warning:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,240,255,0.3);
        }
        .report-list, .doc-list { display: flex; flex-direction: column; gap: 1rem; }
        .report-item, .doc-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        .report-item:hover, .doc-item:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.05); }
        .report-item .title, .doc-item .title { color: var(--neon-blue); font-weight: 600; font-size: 1.1rem; }
        .report-item .meta, .doc-item .meta { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.2rem; }
        .report-item .actions, .doc-item .actions { display: flex; gap: 0.5rem; }
        .report-item .actions button, .doc-item .actions button { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.3rem 0.6rem; border-radius: 6px; transition: all 0.3s ease; }
        .report-item .actions button:hover, .doc-item .actions button:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .report-item .actions .delete:hover, .doc-item .actions .delete:hover { color: #ff4757; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 3rem 0; }
        .empty-state i { font-size: 3rem; color: var(--glass-border); margin-bottom: 1rem; display: block; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--glass-border); border-top: 3px solid var(--neon-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); text-align: center; padding: 2rem; }
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 2rem; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: linear-gradient(135deg, #0a0a12 0%, #050510 100%); border: 1px solid var(--glass-border); border-radius: 25px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2.5rem; }
        .modal-content h2 { color: var(--neon-blue); margin-bottom: 1rem; font-family: 'Orbitron', sans-serif; }
        .modal-content .meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .modal-content .body { color: var(--text-primary); line-height: 1.8; white-space: pre-wrap; }
        .modal-close { margin-top: 1.5rem; padding: 0.6rem 1.5rem; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-primary); cursor: pointer; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 2rem; border-radius: 12px; background: rgba(0,0,0,0.9); border: 1px solid var(--glass-border); color: var(--text-primary); font-weight: 600; z-index: 10001; transform: translateY(100px); opacity: 0; transition: all 0.4s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: var(--neon-green); }
        .toast.error { border-color: #ff4757; }
        .toast.info { border-color: var(--neon-blue); }
        .doc-upload-area { border: 2px dashed var(--glass-border); border-radius: 15px; padding: 2rem; text-align: center; transition: all 0.3s ease; cursor: pointer; margin-bottom: 1.5rem; }
        .doc-upload-area:hover { border-color: var(--neon-blue); background: rgba(0,240,255,0.03); }
        .doc-upload-area i { font-size: 3rem; color: var(--neon-blue); margin-bottom: 1rem; display: block; }
        .doc-upload-area p { color: var(--text-secondary); }
        .doc-upload-area input { display: none; }
        @media (max-width: 768px) { body { padding: 1rem; } .page-header h1 { font-size: 2rem; } .section { padding: 1.5rem; } .report-item, .doc-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; } }
    </style>
</head>
<body>
    <div class="hologram-grid"></div>

    <div class="page-container">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> RETOUR AU DASHBOARD</a>

        <header class="page-header">
            <h1><i class="fas fa-pen-fancy"></i> SECRÉTARIAT</h1>
            <p class="user-info" id="userInfo">CHARGEMENT...</p>
        </header>

        <!-- === ÉDITEUR DE COMPTES RENDUS === -->
        <section class="section">
            <h2 class="section-title"><i class="fas fa-edit"></i> RÉDIGER UN COMPTE RENDU</h2>
            <div class="editor-toolbar">
                <button onclick="insertFormat('h1')"><i class="fas fa-heading"></i> H1</button>
                <button onclick="insertFormat('h2')">H2</button>
                <button onclick="insertFormat('h3')">H3</button>
                <span style="width:1px; height:24px; background:var(--glass-border); align-self:center;"></span>
                <button onclick="insertFormat('bold')"><i class="fas fa-bold"></i></button>
                <button onclick="insertFormat('italic')"><i class="fas fa-italic"></i></button>
                <button onclick="insertFormat('underline')"><i class="fas fa-underline"></i></button>
                <span style="width:1px; height:24px; background:var(--glass-border); align-self:center;"></span>
                <button onclick="insertFormat('ul')"><i class="fas fa-list-ul"></i></button>
                <button onclick="insertFormat('ol')"><i class="fas fa-list-ol"></i></button>
                <button onclick="insertFormat('hr')"><i class="fas fa-minus"></i></button>
            </div>

            <div id="editorContent" contenteditable="true" placeholder="Écrivez votre compte rendu ici..."></div>

            <div class="editor-actions">
                <input type="text" id="reportTitle" placeholder="Titre du compte rendu..." style="flex:1; padding:0.8rem 1rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:10px; color:var(--text-primary); font-size:1rem; outline:none;">
                <button class="btn-success" onclick="saveReport()"><i class="fas fa-save"></i> SAUVEGARDER</button>
                <button class="btn-danger" onclick="clearEditor()"><i class="fas fa-trash"></i> EFFACER</button>
                <button class="btn-warning" onclick="loadReports()"><i class="fas fa-sync"></i> SYNC</button>
            </div>
        </section>

        <!-- === LISTE DES COMPTES RENDUS === -->
        <section class="section">
            <h2 class="section-title"><i class="fas fa-archive"></i> COMPTES RENDUS ENREGISTRÉS</h2>
            <div id="reportList" class="report-list">
                <div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>
            </div>
        </section>

        <!-- === GESTION DES DOCUMENTS PDF === -->
        <section class="section">
            <h2 class="section-title"><i class="fas fa-folder-open"></i> GESTION DES DOCUMENTS PDF</h2>

            <label class="doc-upload-area" for="docFile">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Cliquez pour ajouter un document PDF</p>
                <p style="font-size:0.85rem; margin-top:0.5rem;">Format accepté : PDF (max 20 Mo)</p>
                <input type="file" id="docFile" accept=".pdf" onchange="uploadDoc()">
            </label>

            <div id="docUploadStatus" style="text-align:center; margin-bottom:1rem;"></div>

            <div id="docList" class="doc-list">
                <div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>
            </div>
        </section>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-content">
            <h2 id="viewTitle">Titre</h2>
            <div class="meta" id="viewMeta">Date</div>
            <div class="body" id="viewBody">Contenu...</div>
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i> FERMER</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ==================== SUPABASE ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== CONFIGURATION SUPABASE ====================
        const SUPABASE_URL = 'https://olgrpycxudzuxtzjxoma.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3JweWN4dWR6dXh0emp4b21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA4MDUsImV4cCI6MjEwNTkwNjgwNX0.Day-sMRM-l6bBWuqCsho6vBPCKNxZaqUB1TgHbF6-TE';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== ACCÈS RESTREINT ====================
        const allowedIds = ['AT21_0016', 'AT21_006', 'Birane186@00'];

        if (localStorage.getItem('memberLoggedIn') !== 'true') {
            window.location.href = 'espace-membres.html';
        }

        const memberId = localStorage.getItem('memberId') || '';
        if (!allowedIds.includes(memberId)) {
            document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;gap:1rem;text-align:center;padding:2rem;"><i class="fas fa-lock" style="font-size:4rem;color:#ff4757;"></i><h1 style="color:#ff4757;">ACCÈS REFUSÉ</h1><p>Cette page est réservée à la Secrétaire Générale et au Président.</p><a href="dashboard.html" style="color:var(--neon-blue);">Retour au Dashboard</a></div>';
            throw new Error('Accès refusé');
        }

        // ==================== INFOS MEMBRE ====================
        const nom = localStorage.getItem('memberNom') || '';
        const prenom = localStorage.getItem('memberPrenom') || '';
        const fonction = localStorage.getItem('memberFonction') || '';
        document.getElementById('userInfo').textContent = `👤 ${prenom} ${nom} - ${fonction} (${memberId})`;

        // ==================== TOAST ====================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ==================== COMPTES RENDUS ====================
        let reportsCache = [];

        async function loadReports() {
            const container = document.getElementById('reportList');
            container.innerHTML = '<div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('comptes_rendus')
                    .select('*')
                    .order('timestamp', { ascending: false });

                if (error) throw error;

                reportsCache = data || [];

                if (reportsCache.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>Aucun compte rendu.</p></div>';
                    return;
                }

                container.innerHTML = reportsCache.map(r => `
                    <div class="report-item">
                        <div class="info" onclick="viewReport('${r.id}')" style="flex:1; cursor:pointer;">
                            <div class="title">${r.title || 'Sans titre'}</div>
                            <div class="meta">📅 ${r.date} - ✍️ ${r.author}</div>
                        </div>
                        <div class="actions">
                            <button onclick="viewReport('${r.id}')"><i class="fas fa-eye"></i></button>
                            <button class="delete" onclick="deleteReport('${r.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="empty-state">❌ Erreur : ' + error.message + '</div>';
            }
        }

        async function saveReport() {
            const editor = document.getElementById('editorContent');
            const titleInput = document.getElementById('reportTitle');
            const content = editor.innerHTML.trim();
            const title = titleInput.value.trim() || 'Sans titre';

            if (!content || content === '<br>') {
                showToast('⚠️ Écrivez du contenu.', 'error');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
            const author = `${prenom} ${nom}`.trim() || 'Inconnu';

            try {
                const { error } = await supabaseClient
                    .from('comptes_rendus')
                    .insert([{
                        title: title,
                        content: content,
                        author: author,
                        date: dateStr,
                        timestamp: Date.now()
                    }]);

                if (error) throw error;

                showToast('✅ Compte rendu sauvegardé !', 'success');
                editor.innerHTML = '';
                titleInput.value = '';
                loadReports();
            } catch (error) {
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        }

        async function deleteReport(id) {
            if (!confirm('Supprimer ce compte rendu ?')) return;
            try {
                const { error } = await supabaseClient
                    .from('comptes_rendus')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showToast('🗑️ Supprimé.', 'info');
                loadReports();
            } catch (error) {
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        }

        function viewReport(id) {
            const r = reportsCache.find(x => x.id === id);
            if (!r) return;
            document.getElementById('viewTitle').textContent = r.title || 'Sans titre';
            document.getElementById('viewMeta').textContent = `📅 ${r.date} - ✍️ ${r.author}`;
            document.getElementById('viewBody').innerHTML = r.content;
            document.getElementById('viewModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('viewModal').classList.remove('active');
        }

        document.getElementById('viewModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function clearEditor() {
            if (confirm('Effacer le contenu ?')) {
                document.getElementById('editorContent').innerHTML = '';
                document.getElementById('reportTitle').value = '';
            }
        }

        function insertFormat(type) {
            const editor = document.getElementById('editorContent');
            editor.focus();
            const sel = window.getSelection();
            if (sel.rangeCount === 0) {
                const range = document.createRange();
                range.setStart(editor, 0);
                sel.addRange(range);
            }
            switch(type) {
                case 'h1': document.execCommand('formatBlock', false, '<h1>'); break;
                case 'h2': document.execCommand('formatBlock', false, '<h2>'); break;
                case 'h3': document.execCommand('formatBlock', false, '<h3>'); break;
                case 'bold': document.execCommand('bold'); break;
                case 'italic': document.execCommand('italic'); break;
                case 'underline': document.execCommand('underline'); break;
                case 'ul': document.execCommand('insertUnorderedList'); break;
                case 'ol': document.execCommand('insertOrderedList'); break;
                case 'hr': document.execCommand('insertHorizontalRule'); break;
            }
        }

        // ==================== GESTION DES DOCUMENTS PDF ====================
        let docsCache = [];

        async function uploadDoc() {
            const fileInput = document.getElementById('docFile');
            const file = fileInput.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                showToast('⚠️ Seuls les PDF sont acceptés.', 'error');
                return;
            }

            if (file.size > 20 * 1024 * 1024) {
                showToast('⚠️ Fichier trop volumineux (max 20 Mo).', 'error');
                return;
            }

            const statusDiv = document.getElementById('docUploadStatus');
            statusDiv.innerHTML = '<div class="loading-spinner"></div> Upload en cours...';

            try {
                const timestamp = Date.now();
                const fileName = `${timestamp}_${file.name}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('documents')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('documents')
                    .getPublicUrl(fileName);

                const now = new Date();

                const { error: dbError } = await supabaseClient
                    .from('documents_pdf')
                    .insert([{
                        name: file.name,
                        url: urlData.publicUrl,
                        storage_path: fileName,
                        size: file.size,
                        upload_date: now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}),
                        uploaded_by: `${prenom} ${nom}`,
                        timestamp: timestamp
                    }]);

                if (dbError) throw dbError;

                statusDiv.innerHTML = '';
                showToast('✅ Document ajouté !', 'success');
                fileInput.value = '';
                loadDocs();
            } catch (error) {
                statusDiv.innerHTML = '';
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        }

        async function loadDocs() {
            const container = document.getElementById('docList');
            container.innerHTML = '<div class="loading-text"><div class="loading-spinner"></div> Chargement...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('documents_pdf')
                    .select('*')
                    .order('timestamp', { ascending: false });

                if (error) throw error;

                docsCache = data || [];

                if (docsCache.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>Aucun document enregistré.</p></div>';
                    return;
                }

                container.innerHTML = docsCache.map(d => `
                    <div class="doc-item">
                        <div class="info" onclick="window.open('${d.url}', '_blank')" style="flex:1; cursor:pointer;">
                            <div class="title"><i class="fas fa-file-pdf" style="color:#ff4757;"></i> ${d.name}</div>
                            <div class="meta">📅 ${d.upload_date} - ✍️ ${d.uploaded_by}</div>
                        </div>
                        <div class="actions">
                            <button onclick="window.open('${d.url}', '_blank')"><i class="fas fa-download"></i></button>
                            <button class="delete" onclick="deleteDoc('${d.id}', '${d.storage_path}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="empty-state">❌ Erreur : ' + error.message + '</div>';
            }
        }

        async function deleteDoc(docId, storagePath) {
            if (!confirm('Supprimer ce document ?')) return;
            try {
                const { error: dbError } = await supabaseClient
                    .from('documents_pdf')
                    .delete()
                    .eq('id', docId);

                if (dbError) throw dbError;

                await supabaseClient.storage
                    .from('documents')
                    .remove([storagePath]);

                showToast('🗑️ Document supprimé.', 'info');
                loadDocs();
            } catch (error) {
                showToast('❌ Erreur : ' + error.message, 'error');
            }
        }

        // ==================== INIT ====================
        loadReports();
        loadDocs();
    </script>
</body>
</html>
