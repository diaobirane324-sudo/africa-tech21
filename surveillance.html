<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance | MAJOR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; }
        :root {
            --neon-blue: #00f0ff; --neon-green: #00ff88; --neon-red: #ff003c;
            --neon-gold: #ffd700; --text-primary: #fff; --text-secondary: #a0a8c0;
        }
        body {
            background: #050510; color: var(--text-primary); min-height: 100vh;
            display: flex; flex-direction: column;
        }
        
        /* ÉCRAN DE VERROUILLAGE */
        .lock-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem; width: 100%;
        }
        .lock-card {
            background: #0a0a18; border: 2px solid var(--neon-red);
            border-radius: 20px; padding: 3rem 2.5rem;
            max-width: 450px; width: 100%; text-align: center;
            box-shadow: 0 0 50px rgba(255,0,60,0.3);
        }
        .lock-card i { font-size: 3rem; color: var(--neon-red); margin-bottom: 1rem; }
        .lock-card h1 { font-family: 'Orbitron'; color: var(--neon-red); margin-bottom: 1rem; letter-spacing: 2px; }
        .lock-card p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        .lock-card input {
            width: 100%; padding: 1rem; font-size: 1.1rem; text-align: center;
            background: #000; border: 2px solid var(--neon-red); border-radius: 10px;
            color: var(--neon-gold); margin-bottom: 1rem; outline: none;
            font-family: monospace; letter-spacing: 3px;
        }
        .lock-card button {
            width: 100%; padding: 1rem; background: var(--neon-red);
            border: none; border-radius: 10px; color: #fff; font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: 0.3s;
            font-family: 'Orbitron'; letter-spacing: 2px;
        }
        .lock-card button:hover { background: #cc0033; transform: scale(1.02); }
        .lock-err { color: var(--neon-red); font-weight: bold; margin-top: 1rem; display: none; }

        /* DASHBOARD */
        .dashboard { display: none; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        .dashboard.active { display: block; }
        
        .header {
            background: #0a0a18; border: 1px solid var(--neon-red);
            border-radius: 15px; padding: 1.5rem; margin-bottom: 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-family: 'Orbitron'; color: var(--neon-red); font-size: 1.5rem; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat {
            background: #0a0a18; border: 1px solid #333; border-radius: 10px;
            padding: 1.5rem; text-align: center;
        }
        .stat-val { font-size: 2rem; font-weight: bold; color: var(--neon-blue); font-family: 'Orbitron'; }
        .stat-lbl { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 0.5rem; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #333; }
        .tab {
            padding: 1rem 1.5rem; background: transparent; border: none;
            color: var(--text-secondary); font-family: 'Orbitron'; font-size: 0.8rem;
            cursor: pointer; transition: 0.3s;
        }
        .tab.active { color: var(--neon-blue); border-bottom: 3px solid var(--neon-blue); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel { background: #0a0a18; border: 1px solid #333; border-radius: 10px; padding: 1.5rem; }
        .panel h2 { color: var(--neon-blue); font-size: 1.2rem; margin-bottom: 1rem; font-family: 'Orbitron'; }

        .member-row {
            background: #111; border: 1px solid #333; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.8rem; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .member-name { color: var(--neon-blue); font-weight: bold; }
        .member-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .meta-badge {
            background: rgba(0,240,255,0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 0.3rem 0.6rem; border-radius: 5px;
            font-size: 0.75rem; font-family: monospace;
        }
        .meta-green { background: rgba(0,255,136,0.1); border-color: var(--neon-green); color: var(--neon-green); }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.8rem; color: var(--neon-blue); border-bottom: 2px solid #333; }
        td { padding: 0.8rem; border-bottom: 1px solid #222; color: var(--text-secondary); }
        
        .loading { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .btn-refresh {
            background: var(--neon-blue); color: #000; border: none;
            padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-family: 'Orbitron'; transition: 0.3s;
        }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-refresh i { margin-right: 0.4rem; }

        /* Alerte d'erreur */
        .error-banner {
            background: rgba(255,0,60,0.1); border: 1px solid var(--neon-red);
            color: var(--neon-red); padding: 1rem; border-radius: 8px;
            margin-bottom: 1rem; display: none; font-weight: bold;
        }
    </style>
</head>
<body>

<!-- ÉCRAN DE VERROUILLAGE -->
<div class="lock-screen" id="lockScreen">
    <div class="lock-card">
        <i class="fas fa-shield-halved"></i>
        <h1>ACCÈS MAJOR</h1>
        <p>Entrez le mot de passe pour accéder au système.</p>
        <input type="password" id="pwdInput" placeholder="MOT DE PASSE">
        <button type="button" onclick="unlock()">DÉVERROUILLER</button>
        <div class="lock-err" id="lockErr">❌ Mot de passe incorrect</div>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <h1><i class="fas fa-satellite-dish"></i> SURVEILLANCE</h1>
        <button class="btn-refresh" id="btnRefresh" onclick="loadData()">
            <i class="fas fa-sync"></i> ACTUALISER
        </button>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <div class="stats">
        <div class="stat">
            <div class="stat-lbl">En ligne</div>
            <div class="stat-val" id="statOnline">-</div>
        </div>
        <div class="stat">
            <div class="stat-lbl">Total membres</div>
            <div class="stat-val" id="statTotal">-</div>
        </div>
        <div class="stat">
            <div class="stat-lbl">Alertes</div>
            <div class="stat-val" id="statAlertes">-</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('tab-online', this)">En ligne</button>
        <button class="tab" onclick="showTab('tab-assiduite', this)">Assiduité</button>
        <button class="tab" onclick="showTab('tab-activites', this)">Activités</button>
    </div>

    <div class="tab-content active" id="tab-online">
        <div class="panel">
            <h2>Membres connectés</h2>
            <div id="onlineList"><div class="loading">Chargement...</div></div>
        </div>
    </div>

    <div class="tab-content" id="tab-assiduite">
        <div class="panel">
            <h2>Temps de travail (7j)</h2>
            <div id="assiduiteContent"><div class="loading">Chargement...</div></div>
        </div>
    </div>

    <div class="tab-content" id="tab-activites">
        <div class="panel">
            <h2>Activités récentes</h2>
            <div id="activitesContent"><div class="loading">Chargement...</div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================
// CONFIGURATION
// ============================================
const SUPABASE_URL = 'https://olgrpycxudzuxtzjxoma.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3JweWN4dWR6dXh0emp4b21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA4MDUsImV4cCI6MjEwNTkwNjgwNX0.Day-sMRM-l6bBWuqCsho6vBPCKNxZaqUB1TgHbF6-TE';
const MAJOR_PASSWORD = 'MAJOR2024'; // Changez ce mot de passe

let supabaseClient = null;
let allData = { online: [], assiduite: [], activites: [] };

// ============================================
// DÉVERROUILLAGE
// ============================================
function unlock() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd === MAJOR_PASSWORD) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
        initSupabase();
    } else {
        document.getElementById('lockErr').style.display = 'block';
    }
}

// Permettre d'appuyer sur Entrée
document.getElementById('pwdInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') unlock();
});

// ============================================
// INITIALISATION SUPABASE
// ============================================
function initSupabase() {
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        loadData();
        setInterval(loadData, 30000); // Auto-refresh 30s
    } catch (e) {
        showError("Erreur d'initialisation Supabase : " + e.message);
    }
}

// ============================================
// AFFICHAGE DES ERREURS
// ============================================
function showError(msg) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = "⚠️ " + msg;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 8000);
}

// ============================================
// NAVIGATION
// ============================================
function showTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}

// ============================================
// CHARGEMENT DES DONNÉES
// ============================================
async function loadData() {
    if (!supabaseClient) return;

    const btn = document.getElementById('btnRefresh');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CHARGEMENT...';

    try {
        // 1. En ligne
        const resOnline = await supabaseClient.from('vue_connectes').select('*');
        if (resOnline.error) throw new Error("Table 'vue_connectes' : " + resOnline.error.message);
        allData.online = resOnline.data || [];
        document.getElementById('statOnline').textContent = allData.online.length;
        renderOnline();

        // 2. Assiduité
        const resAssid = await supabaseClient.from('vue_activite_7j').select('*');
        if (resAssid.error) throw new Error("Table 'vue_activite_7j' : " + resAssid.error.message);
        allData.assiduite = resAssid.data || [];
        document.getElementById('statTotal').textContent = allData.assiduite.length;
        renderAssiduite();

        // 3. Activités
        const resAct = await supabaseClient.from('surveillance_activites').select('*').order('timestamp', { ascending: false }).limit(50);
        if (resAct.error) throw new Error("Table 'surveillance_activites' : " + resAct.error.message);
        allData.activites = resAct.data || [];
        renderActivites();

        // 4. Alertes
        const resAlert = await supabaseClient.from('surveillance_alertes').select('*').eq('statut', 'nouvelle');
        if (!resAlert.error) {
            document.getElementById('statAlertes').textContent = (resAlert.data || []).length;
        }

    } catch (e) {
        console.error("Erreur:", e);
        showError(e.message);
        // Même en cas d'erreur, on affiche un message dans chaque section
        document.getElementById('onlineList').innerHTML = '<div class="loading" style="color:#ff003c;">Erreur de chargement. Vérifiez la console (F12).</div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync"></i> ACTUALISER';
    }
}

// ============================================
// AFFICHAGE : EN LIGNE
// ============================================
function renderOnline() {
    const container = document.getElementById('onlineList');
    if (allData.online.length === 0) {
        container.innerHTML = '<div class="loading">Aucun membre connecté actuellement.</div>';
        return;
    }
    container.innerHTML = allData.online.map(m => `
        <div class="member-row">
            <div class="member-name">${m.member_nom || 'Inconnu'}</div>
            <div class="member-meta">
                <span class="meta-badge meta-green">EN LIGNE</span>
                <span class="meta-badge">${Math.floor((m.duree_actuelle_sec||0)/60)} min</span>
                <span class="meta-badge">${m.fonction || 'Membre'}</span>
            </div>
        </div>
    `).join('');
}

// ============================================
// AFFICHAGE : ASSIDUITÉ
// ============================================
function renderAssiduite() {
    const container = document.getElementById('assiduiteContent');
    if (allData.assiduite.length === 0) {
        container.innerHTML = '<div class="loading">Aucune donnée d\'assiduité. (Le tracker n\'a peut-être pas encore enregistré d\'activité).</div>';
        return;
    }
    container.innerHTML = `
        <table>
            <thead><tr><th>Membre</th><th>Fonction</th><th>Temps (min)</th><th>Jours actifs</th></tr></thead>
            <tbody>
                ${allData.assiduite.map(a => `
                    <tr>
                        <td style="color:var(--neon-blue);">${a.member_nom || '?'}</td>
                        <td>${a.fonction || 'Membre'}</td>
                        <td>${a.temps_total_min || 0}</td>
                        <td>${a.nb_jours_actifs || 0}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

// ============================================
// AFFICHAGE : ACTIVITÉS
// ============================================
function renderActivites() {
    const container = document.getElementById('activitesContent');
    if (allData.activites.length === 0) {
        container.innerHTML = '<div class="loading">Aucune activité récente. (Le tracker n\'a peut-être pas encore enregistré d\'activité).</div>';
        return;
    }
    container.innerHTML = `
        <table>
            <thead><tr><th>Membre</th><th>Action</th><th>Page</th><th>Date</th></tr></thead>
            <tbody>
                ${allData.activites.map(a => `
                    <tr>
                        <td style="color:var(--neon-blue);">${a.member_nom || '?'}</td>
                        <td>${a.type_action || '?'}</td>
                        <td>${a.page || '—'}</td>
                        <td>${new Date(a.timestamp).toLocaleString('fr-FR')}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}
</script>
</body>
</html>
