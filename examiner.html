<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examiner mon travail | AFRICA.TECH21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', 'Segoe UI', sans-serif;
        }
        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #7b2cbf;
            --neon-green: #00ff88;
            --neon-pink: #ff00ff;
            --dark-space: #0a0a12;
            --deep-space: #050510;
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --panel-glow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        body {
            background: linear-gradient(135deg, var(--deep-space) 0%, var(--dark-space) 50%, #0f0f1f 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }
        .hologram-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScan 20s linear infinite;
            pointer-events: none;
            z-index: -2;
        }
        @keyframes gridScan {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        .back-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            margin-bottom: 2rem;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .page-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .page-header {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: var(--panel-glow);
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }
        .form-section {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 2.5rem;
            box-shadow: var(--panel-glow);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            color: var(--neon-blue);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .form-group input[type="file"] {
            width: 100%;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .form-group input[type="file"]:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.05);
        }
        .form-group input[type="file"]::file-selector-button {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 1rem;
        }
        .form-group input[type="file"]::file-selector-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .form-group textarea {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }
        .form-group .file-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(123, 44, 191, 0.6);
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            border-left: 4px solid var(--neon-blue);
            display: none;
            max-height: 600px;
            overflow-y: auto;
        }
        .result-box.active {
            display: block;
        }
        .result-box .label {
            color: var(--neon-green);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .result-box .content {
            color: var(--text-primary);
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1rem;
        }
        .result-box .note {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-blue);
            margin: 1rem 0;
            padding: 0.5rem 1rem;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 10px;
            display: inline-block;
        }
        .loading-text {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
            display: none;
        }
        .loading-text.active {
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast-message {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.95);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
            animation: fadeInUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .page-header h1 { font-size: 2rem; }
            .form-section { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="hologram-grid"></div>

    <div class="page-container">
        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> RETOUR AU DASHBOARD
        </a>

        <header class="page-header">
            <h1><i class="fas fa-file-pdf"></i> EXAMINER MON TRAVAIL</h1>
            <p class="subtitle">Déposez votre travail (PDF) pour une évaluation ultra-rigoureuse par le système.</p>
        </header>

        <div class="form-section">
            <form id="examForm">
                <div class="form-group">
                    <label for="fileInput"><i class="fas fa-upload"></i> Fichier PDF</label>
                    <input type="file" id="fileInput" accept=".pdf" required>
                    <div class="file-info" id="fileInfo">Aucun fichier sélectionné</div>
                </div>

                <div class="form-group">
                    <label for="commentInput"><i class="fas fa-comment"></i> Commentaire (optionnel)</label>
                    <textarea id="commentInput" placeholder="Ajoutez des précisions sur votre travail..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> ENVOYER POUR EXAMEN
                </button>
            </form>

            <div class="loading-text" id="loadingArea">
                <div class="loading-spinner"></div>
                <p>Le système examine votre travail...</p>
                <p style="font-size:0.9rem; color:var(--text-secondary);">L'examen est très rigoureux, cela peut prendre quelques secondes.</p>
            </div>

            <div class="result-box" id="resultBox">
                <div class="label">📋 RAPPORT D'EXAMEN</div>
                <div class="content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== VÉRIFICATION CONNEXION ====================
        if (localStorage.getItem('memberLoggedIn') !== 'true') {
            window.location.href = 'espace-membres.html';
        }

        // ==================== CONFIGURATION ====================
        const GROQ_API_KEY = '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';
        const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
        const SCRIPT_URL_EVAL = 'https://script.google.com/macros/s/AKfycbwuzAsRuuu1XYJrdlGm79Hq1sHJpN8IhQuV3_v9AYCel-rhLAyhMt_7Xrg75W2_rIc/exec';

        // ==================== RÉFÉRENCES DOM ====================
        const form = document.getElementById('examForm');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const loadingArea = document.getElementById('loadingArea');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');

        // ==================== AFFICHAGE NOM DU FICHIER ====================
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileInfo.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(0)} Ko)`;
            } else {
                fileInfo.textContent = 'Aucun fichier sélectionné';
            }
        });

        // ==================== FONCTION POUR EXTRAIRE LE TEXTE D'UN PDF ====================
        async function extraireTextePDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let texteComplet = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                texteComplet += strings.join(' ') + '\n';
            }
            return texteComplet.trim();
        }

        // ==================== AFFICHER UN MESSAGE TEMPORAIRE ====================
        function showToast(message) {
            const old = document.querySelector('.toast-message');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // ==================== SAUVEGARDER DANS GOOGLE SHEETS ====================
        async function sauvegarderEvaluation(membre, fichier, commentaire, note, mention, rapport) {
            try {
                const date = new Date().toLocaleString('fr-FR');
                const response = await fetch(SCRIPT_URL_EVAL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        membre: membre,
                        fichier: fichier,
                        commentaire: commentaire,
                        note: note,
                        mention: mention,
                        rapport: rapport,
                        date: date
                    })
                });
                const result = await response.json();
                if (result.success) {
                    console.log('✅ Évaluation sauvegardée dans Google Sheets');
                } else {
                    console.warn('⚠️ Erreur sauvegarde:', result.error);
                }
            } catch (error) {
                console.warn('⚠️ Erreur réseau (sauvegarde):', error);
            }
        }

        // ==================== SOUMISSION DU FORMULAIRE ====================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                showToast('⚠️ Veuillez sélectionner un fichier PDF.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> EXAMEN EN COURS...';
            loadingArea.classList.add('active');
            resultBox.classList.remove('active');
            resultContent.textContent = '';

            try {
                let textePDF = '';
                try {
                    textePDF = await extraireTextePDF(file);
                } catch (err) {
                    showToast('❌ Impossible de lire le PDF. Vérifiez qu\'il n\'est pas corrompu.');
                    throw err;
                }

                if (textePDF.length < 10) {
                    showToast('⚠️ Le PDF semble vide ou contient peu de texte.');
                    throw new Error('PDF vide');
                }

                const commentaire = commentInput.value.trim() || 'Aucun commentaire fourni.';
                const membre = localStorage.getItem('memberPrenom') + ' ' + localStorage.getItem('memberNom') || 'Membre inconnu';

                const systemPrompt = `Tu es un examinateur technique extrêmement rigoureux, plus sévère que le MAJOR lui-même. 
Tu évalues des travaux techniques (robotique, électronique, programmation, projets d'ingénierie). 
Tu identifies les failles, les incohérences, les approximations, les oublis, les raisonnements erronés. 
Tu notes sur 20 et tu donnes un avis structuré comme suit :

📌 NOTE : X/20
📌 MENTION : [Excellent / Très Bien / Bien / Passable / Insuffisant]
📌 POINTS FORTS : (liste)
📌 POINTS FAIBLES : (liste précise, impitoyable)
📌 SUGGESTIONS D'AMÉLIORATION : (concrètes)
📌 CONCLUSION GÉNÉRALE : (un paragraphe clair)

Tu ne laisses rien passer. Tu es impitoyable sur la rigueur. Si le travail est médiocre, tu le dis. Si c'est excellent, tu le reconnais mais sans complaisance.`;

                const userMessage = `
Membre : ${membre}
Commentaire du membre : ${commentaire}

Contenu du travail (extrait du PDF) :
---
${textePDF.substring(0, 12000)}
---
`;

                const response = await fetch(GROQ_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userMessage }
                        ],
                        temperature: 0.2,
                        max_tokens: 1500
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'Erreur API');
                }

                const data = await response.json();
                const reponseIA = data.choices[0].message.content;

                // Extraire la note et la mention
                const noteMatch = reponseIA.match(/NOTE\s*:\s*(\d+)\/20/);
                const mentionMatch = reponseIA.match(/MENTION\s*:\s*([^\n]+)/);
                const note = noteMatch ? noteMatch[1] : 'Non spécifiée';
                const mention = mentionMatch ? mentionMatch[1].trim() : 'Non spécifiée';

                // Sauvegarder dans Google Sheets
                const fichierNom = file.name;
                await sauvegarderEvaluation(membre, fichierNom, commentaire, note, mention, reponseIA);

                // Afficher le résultat
                resultContent.innerHTML = reponseIA.replace(/\n/g, '<br>');
                resultBox.classList.add('active');

            } catch (error) {
                showToast('❌ Erreur : ' + error.message);
                resultContent.textContent = 'Une erreur est survenue. Veuillez réessayer.';
                resultBox.classList.add('active');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ENVOYER POUR EXAMEN';
                loadingArea.classList.remove('active');
            }
        });
    </script>
</body>
</html>
