    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #7b2cbf;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --gold: #ffd700;
            --gold-glow: 0 0 30px rgba(255, 215, 0, 0.5);
            --dark-space: #0a0a12;
            --deep-space: #050510;
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 44, 191, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--deep-space) 0%, var(--dark-space) 50%, #0f0f1f 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .hologram-grid {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScan 25s linear infinite;
            pointer-events: none; z-index: -2;
        }
        @keyframes gridScan { 0% { transform: translate(0, 0); } 100% { transform: translate(60px, 60px); } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle {
            position: absolute; width: 3px; height: 3px;
            background: var(--gold); border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px var(--gold);
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }
        .back-btn {
            display: inline-block; padding: 0.8rem 2rem; margin-bottom: 2rem;
            background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold);
            border-radius: 10px; color: var(--gold); text-decoration: none;
            font-weight: 600; transition: all 0.3s ease;
        }
        .back-btn:hover { background: rgba(255, 215, 0, 0.2); box-shadow: var(--gold-glow); }
        .page-container { max-width: 1400px; margin: 0 auto; }
        .page-header {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(123, 44, 191, 0.08));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 3.5rem 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        .page-header::before {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .crown-icon {
            font-size: 4rem; color: var(--gold);
            margin-bottom: 1rem; text-shadow: var(--gold-glow);
            animation: pulseCrown 2s ease-in-out infinite;
            position: relative; z-index: 1;
        }
        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--gold)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px var(--gold)); }
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(45deg, var(--gold), #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: 900;
            position: relative; z-index: 1;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            margin-top: 0.8rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative; z-index: 1;
        }
        .user-info {
            margin-top: 1.5rem; display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem; border-radius: 20px;
            color: var(--gold); font-weight: 600;
            position: relative; z-index: 1;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem; color: var(--gold);
            margin-bottom: 2rem;
            display: flex; align-items: center; gap: 1rem;
            letter-spacing: 2px;
        }
        .section-title i { color: var(--neon-green); }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            margin-bottom: 4rem;
        }
        .feature-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.03), rgba(123, 44, 191, 0.03));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 3rem 2.5rem;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.08), transparent);
            transition: 0.6s;
        }
        .feature-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
        }
        .feature-card:hover::before { left: 100%; }
        .feature-icon {
            font-size: 4rem; color: var(--gold);
            margin-bottom: 2rem; text-align: center;
            text-shadow: var(--gold-glow);
            transition: all 0.3s ease;
        }
        .feature-card:hover .feature-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 25px var(--gold));
        }
        .feature-title {
            font-size: 1.7rem; color: var(--gold);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
        .feature-description {
            color: var(--text-secondary);
            line-height: 1.7;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .feature-status {
            text-align: center;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 0.9rem;
        }
        .modal-overlay {
            display: flex;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            align-items: center; justify-content: center;
            padding: 2rem;
        }
        .modal-overlay.hidden { display: none; }
        .modal-content {
            background: linear-gradient(135deg, #0a0a12 0%, #050510 100%);
            border: 2px solid var(--gold);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.3);
            animation: modalAppear 0.4s ease;
        }
        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
            text-shadow: var(--gold-glow);
        }
        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .camera-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1/1;
            border: 2px solid rgba(255, 215, 0, 0.4);
            margin-bottom: 1rem;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
        }
        .scan-overlay {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        .scan-frame {
            position: absolute; top: 15%; left: 15%; right: 15%; bottom: 15%;
            border: 3px solid var(--gold);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 30px rgba(255, 215, 0, 0.2);
            animation: pulseFrame 1.5s infinite;
        }
        @keyframes pulseFrame {
            0%,100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 30px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 1), inset 0 0 50px rgba(255, 215, 0, 0.4); }
        }
        .scan-frame::before {
            content:''; position:absolute; top:-3px; left:-3px;
            width:40px; height:40px;
            border-top:5px solid var(--neon-green); border-left:5px solid var(--neon-green);
            border-radius:15px 0 0 0;
        }
        .scan-frame::after {
            content:''; position:absolute; bottom:-3px; right:-3px;
            width:40px; height:40px;
            border-bottom:5px solid var(--neon-green); border-right:5px solid var(--neon-green);
            border-radius:0 0 15px 0;
        }
        .scan-line {
            position: absolute; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: scanLine 2s linear infinite;
            box-shadow: 0 0 15px var(--gold);
        }
        @keyframes scanLine {
            0% { top: 15%; }
            100% { top: 85%; }
        }
        .status-text {
            text-align: center;
            padding: 0.9rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--gold);
            letter-spacing: 1px;
        }
        .status-text.success {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        .status-text.error {
            background: rgba(255, 0, 51, 0.15);
            border-color: #ff0033;
            color: #ff0033;

        .btn-access {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            border: none;
            border-radius: 12px;
            color: #0a0505;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 0.6rem;
        }
        .btn-access:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }
        .btn-secondary {
            width: 100%;
            padding: 0.9rem 2rem;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 12px;
            color: var(--gold);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .btn-secondary:hover { background: rgba(255, 215, 0, 0.2); }
        .admin-row { display: flex; gap: 0.6rem; }
        .admin-row .btn-secondary { flex: 1; }
        .admin-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .admin-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .error-msg {
            color: #ff4757;
            margin-top: 0.8rem;
            min-height: 22px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .page-header { padding: 2.5rem 1.5rem; }
            .page-header h1 { font-size: 2rem; }
            .features-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .feature-card { padding: 2rem 1.5rem; }
            .modal-content { padding: 1.8rem; }
        }
    </style>
</head>

function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 60; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDelay = Math.random() * 15 + 's';
        p.style.animationDuration = (10 + Math.random() * 12) + 's';
        const colors = ['#ffd700', '#00f0ff', '#7b2cbf'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 10px ${p.style.background}`;
        container.appendChild(p);
    }
}

function setStatus(msg, type='') {
    const el = document.getElementById('statusText');
    el.className = 'status-text ' + type;
    el.innerHTML = msg;
}

// ==================== CAMÉRA ====================
async function demarrerCamera() {
    document.getElementById('errorMsg').textContent = '';
    try {
        setStatus('<i class="fas fa-spinner fa-spin"></i> Demande accès caméra...', '');
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        document.getElementById('cameraContainer').style.display = 'block';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';

        setStatus('<i class="fas fa-qrcode"></i> Présentez le QR code de votre carte', '');
        scanning = true;
        requestAnimationFrame(boucleScan);

    } catch (e) {
        setStatus('❌ Impossible d\'accéder à la caméra', 'error');
        document.getElementById('errorMsg').textContent = 'Autorisez l\'accès à la caméra dans votre navigateur.';
    }
}

function arreterCamera() {
    scanning = false;
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    document.getElementById('cameraContainer').style.display = 'none';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnStop').style.display = 'none';
    setStatus('<i class="fas fa-camera"></i> Caméra arrêtée', '');
}

// ==================== SCAN BOUCLE ====================
function boucleScan() {
    if (!scanning) return;
    const video = document.getElementById('video');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        if (!canvas) {
            canvas = document.createElement('canvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        try {
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: 'dontInvert'
            });

            if (code && code.data) {
                const data = code.data.trim();
                // Accepter lien direct OU ancien format
                if (data.includes('carte=') || data.startsWith('AFRICA21:')) {
                    scanning = false;
                    traiterQR(data);
                    return;
                }
            }
        } catch (e) {}
    }
    if (scanning) requestAnimationFrame(boucleScan);
}

// ==================== TRAITEMENT QR ====================
async function traiterQR(qrData) {
    // Extraire le code carte depuis le lien ou l'ancien format
    let codeCarte = '';
    if (qrData.includes('carte=')) {
        // Format lien : direction.html?carte=AT21_006_XXXX
        codeCarte = qrData.split('carte=')[1].split('&')[0];
    } else if (qrData.startsWith('AFRICA21:')) {
        // Ancien format : AFRICA21:AT21_006:XXXX:DIRECTION
        const parts = qrData.split(':');
        codeCarte = parts[1] + '_' + parts[2];
    }

    if (!codeCarte) {
        setStatus('❌ QR code invalide', 'error');
        return;
    }

    await connecterMembreViaCarte(codeCarte);
}

// ==================== CONNEXION MEMBRE ====================
async function connecterMembreViaCarte(codeCarte) {
    setStatus('<i class="fas fa-spinner fa-spin"></i> Vérification en cours...', '');

    try {
        const { data, error } = await supabaseClient
            .from('cartes_membres')
            .select('*')
            .eq('code_carte', codeCarte)
            .eq('actif', true)
            .single();

        if (error || !data) {
            setStatus('❌ CARTE INVALIDE — Accès refusé', 'error');
            setTimeout(() => {
                if (stream) {
                    scanning = true;
                    setStatus('<i class="fas fa-qrcode"></i> Présentez le QR code de votre carte', '');
                    requestAnimationFrame(boucleScan);
                }
            }, 2500);
            return;
        }

        // Mettre à jour la dernière utilisation
        await supabaseClient.from('cartes_membres').update({
            derniere_utilisation: new Date().toLocaleString('fr-FR')
        }).eq('id', data.id);

        setStatus('✅ ACCÈS AUTORISÉ — ' + data.membre_nom, 'success');

        const membre = MEMBRES_DIRECTION[data.membre_id];
        if (!membre) {
            setStatus('❌ Membre non reconnu dans la base', 'error');
            return;
        }

        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        scanning = false;
        membreActuel = membre;

        setTimeout(() => {
            document.getElementById('accessModal').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';
            afficherPostes();
        }, 1200);

    } catch (e) {
        setStatus('❌ Erreur : ' + e.message, 'error');
    }
}

// ==================== CODE ADMIN ====================
function ouvrirModalAdmin() {
    document.getElementById('adminSection').style.display = 'block';
    document.getElementById('inputAdminCode').value = '';
    document.getElementById('inputAdminCode').focus();
}

function fermerModalAdmin() {
    document.getElementById('adminSection').style.display = 'none';
    document.getElementById('inputAdminCode').value = '';
    document.getElementById('errorMsg').textContent = '';
}

function verifierCodeAdmin() {
    const code = document.getElementById('inputAdminCode').value.trim();
    const errEl = document.getElementById('errorMsg');

    if (code === CODE_ADMIN) {
        setStatus('✅ CODE ADMIN VALIDÉ', 'success');
        membreActuel = MEMBRES_DIRECTION['AT21_006'];
        document.getElementById('accessModal').classList.add('hidden');
        document.getElementById('mainContent').style.display = 'block';
        afficherPostes();
    } else {
        errEl.textContent = '❌ Code incorrect';
        document.getElementById('inputAdminCode').value = '';
        setTimeout(() => errEl.textContent = '', 3000);
    }
}

document.getElementById('inputAdminCode').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') verifierCodeAdmin();
});

// ==================== AFFICHAGE DES POSTES ====================
function afficherPostes() {
    document.getElementById('userInfo').innerHTML = 
        `<i class="fas fa-user-shield"></i> ${membreActuel.prenom} ${membreActuel.nom} - ${membreActuel.fonction}`;

    const grid = document.getElementById('featuresGrid');
    grid.innerHTML = '';

    membreActuel.postes.forEach(posteKey => {
        const carte = CARTES[posteKey];
        if (!carte) return;

        const div = document.createElement('div');
        div.className = 'feature-card';
        div.onclick = () => {
            if (carte.link === '#') {
                alert('🚧 Ce poste est en cours de développement.');
            } else {
                window.location.href = carte.link;
            }
        };
        div.innerHTML = `
            <div class="feature-icon"><i class="fas ${carte.icon}"></i></div>
            <h3 class="feature-title">${carte.title}</h3>
            <p class="feature-description">${carte.description}</p>
            <div class="feature-status"><i class="fas fa-shield-alt"></i> ${carte.status}</div>
        `;
        grid.appendChild(div);
    });
}

// ==================== AUTO-CONNEXION VIA URL ====================
async function verifierURL() {
    const params = new URLSearchParams(window.location.search);
    const codeCarte = params.get('carte');

    if (!codeCarte) return;  // Pas de paramètre → laisser le modal s'afficher

    // Masquer le modal, montrer un état de chargement
    setStatus('<i class="fas fa-spinner fa-spin"></i> Connexion automatique...', '');

    try {
        const { data, error } = await supabaseClient
            .from('cartes_membres')
            .select('*')
            .eq('code_carte', codeCarte)
            .eq('actif', true)
            .single();

        if (error || !data) {
            setStatus('❌ CARTE INVALIDE', 'error');
            return;  // Laisser le modal avec le scan
        }

        // Mettre à jour la dernière utilisation
        await supabaseClient.from('cartes_membres').update({
            derniere_utilisation: new Date().toLocaleString('fr-FR')
        }).eq('id', data.id);

        setStatus('✅ BIENVENUE ' + data.membre_nom, 'success');

        const membre = MEMBRES_DIRECTION[data.membre_id];
        if (!membre) {
            setStatus('❌ Membre non reconnu', 'error');
            return;
        }

        membreActuel = membre;

        setTimeout(() => {
            document.getElementById('accessModal').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';
            afficherPostes();
        }, 800);

    } catch (e) {
        setStatus('❌ Erreur : ' + e.message, 'error');
    }
}
