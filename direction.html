<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Direction | AFRICA.TECH21</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', 'Segoe UI', sans-serif; }
        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #7b2cbf;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --gold: #ffd700;
            --gold-glow: 0 0 30px rgba(255, 215, 0, 0.5);
            --dark-space: #0a0a12;
            --deep-space: #050510;
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 44, 191, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--deep-space) 0%, var(--dark-space) 50%, #0f0f1f 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .hologram-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScan 25s linear infinite;
            pointer-events: none;
            z-index: -2;
        }
        @keyframes gridScan { 0% { transform: translate(0, 0); } 100% { transform: translate(60px, 60px); } }
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--gold);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px var(--gold);
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }
        .back-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            margin-bottom: 2rem;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--gold);
            border-radius: 10px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: var(--gold-glow);
        }
        .page-container { max-width: 1400px; margin: 0 auto; }
        .page-header {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(123, 44, 191, 0.08));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 3.5rem 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .crown-icon {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 1rem;
            text-shadow: var(--gold-glow);
            animation: pulseCrown 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--gold)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px var(--gold)); }
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(45deg, var(--gold), #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: 900;
            position: relative;
            z-index: 1;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            margin-top: 0.8rem;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        .user-info {
            margin-top: 1.5rem;
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.8rem 2rem;
            border-radius: 20px;
            color: var(--gold);
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            letter-spacing: 2px;
        }
        .section-title i { color: var(--neon-green); }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            margin-bottom: 4rem;
        }
        .feature-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.03), rgba(123, 44, 191, 0.03));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 3rem 2.5rem;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.08), transparent);
            transition: 0.6s;
        }
        .feature-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
        }
        .feature-card:hover::before { left: 100%; }
        .feature-icon {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: var(--gold-glow);
            transition: all 0.3s ease;
        }
        .feature-card:hover .feature-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 25px var(--gold));
        }
        .feature-title {
            font-size: 1.7rem;
            color: var(--gold);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
        .feature-description {
            color: var(--text-secondary);
            line-height: 1.7;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .feature-status {
            text-align: center;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 0.9rem;
        }
        .modal-overlay {
            display: flex;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal-overlay.hidden { display: none; }
        .modal-content {
            background: linear-gradient(135deg, #0a0a12 0%, #050510 100%);
            border: 2px solid var(--gold);
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.3);
            animation: modalAppear 0.4s ease;
        }
        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: var(--gold-glow);
        }
        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .modal-content input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .modal-content input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }
        .modal-content input::placeholder {
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .btn-access {
            width: 100%;
            padding: 1.2rem 2rem;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            border: none;
            border-radius: 12px;
            color: #0a0505;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }
        .btn-access:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }
        .error-msg {
            color: #ff4757;
            margin-top: 1rem;
            min-height: 24px;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .page-header { padding: 2.5rem 1.5rem; }
            .page-header h1 { font-size: 2rem; }
            .features-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .feature-card { padding: 2rem 1.5rem; }
            .modal-content { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="hologram-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="modal-overlay" id="accessModal">
        <div class="modal-content">
            <i class="fas fa-crown" style="font-size: 3rem; color: var(--gold); margin-bottom: 1rem; display: block;"></i>
            <h2>ACCÈS DIRECTION</h2>
            <p>Entrez votre code d'accès pour accéder à l'espace privé</p>
            <input type="text" id="accessCode" placeholder="" autocomplete="off" autofocus>
            <button class="btn-access" onclick="verifierCode()">
                <i class="fas fa-unlock"></i> ACCÉDER
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <div class="page-container" id="mainContent" style="display:none;">
        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> RETOUR AU DASHBOARD
        </a>

        <header class="page-header">
            <i class="fas fa-crown crown-icon"></i>
            <h1>ESPACE DIRECTION</h1>
            <p class="subtitle">Postes de travail des membres officiels</p>
            <div class="user-info" id="userInfo">
                <i class="fas fa-user-shield"></i> CHARGEMENT...
            </div>
        </header>

        <h2 class="section-title"><i class="fas fa-briefcase"></i> MES POSTES DE TRAVAIL</h2>

        <div class="features-grid" id="featuresGrid"></div>
    </div>

    <script>
        // ==================== BASE DES MEMBRES ====================
        const MEMBRES_DIRECTION = {
            'AT21_006DIR': {
                id: 'AT21_006',
                nom: 'BIRANE',
                prenom: 'DIAO',
                fonction: 'PRÉSIDENT DE LA COMMUNAUTÉ',
                postes: ['espace-major', 'admin-examens', 'espace-projets', 'csiv']
            },
            'AT21_0016DIR': {
                id: 'AT21_0016',
                nom: 'DRAMÉ',
                prenom: 'AICHA',
                fonction: 'SECRÉTAIRE GÉNÉRAL',
                postes: ['secretariat']
            },
            'AT21-001DIR': {
                id: 'AT21-001',
                nom: 'DIAKHATE',
                prenom: 'ABDOU',
                fonction: 'VICE PRÉSIDENT',
                postes: ['vice-president']
            },
            'AT21_0011DIR': {
                id: 'AT21_0011',
                nom: 'MOUHAMED',
                prenom: 'DIALLO',
                fonction: 'RESPONSABLE DES PROJETS',
                postes: ['admin-examens', 'espace-projets']
            },
            'AT21_0026DIR': {
                id: 'AT21_0026',
                nom: 'TOURÉ',
                prenom: 'SOKHNA BINTOU',
                fonction: 'ADJOINTE FINANCE/GESTIONNAIRE',
                postes: ['inventaire']
            },
            'AT21_0036DIR': {
                id: 'AT21_0036',
                nom: 'NDIAYE',
                prenom: 'MARIE ANGÉLIQUE DABA',
                fonction: 'RESPONSABLE COMMUNICATION',
                postes: ['communication', 'csiv']
            },
            'AT21_0031DIR': {
                id: 'AT21_0031',
                nom: 'WADE',
                prenom: 'ADJA FAMA',
                fonction: 'RESPONSABLE FINANCE',
                postes: ['finance']
            }
        };

        // ==================== DÉFINITION DES CARTES ====================
        const CARTES = {
            'espace-major': {
                icon: 'fa-crown',
                title: 'ESPACE MAJOR',
                description: 'Laboratoire technique privé. Zone de développement sécurisée.',
                status: 'NIVEAU MAXIMUM',
                link: 'espace-major.html'
            },
            'admin-examens': {
                icon: 'fa-clipboard-list',
                title: 'ADMIN EXAMENS',
                description: 'Consulter, noter et commenter les travaux soumis par les membres.',
                status: 'RÉSERVÉ MAJOR + PROJETS',
                link: 'admin-examens.html'
            },
            'espace-projets': {
                icon: 'fa-project-diagram',
                title: 'RESPONSABLE PROJETS',
                description: 'Rédaction des projets et évaluation des travaux des membres.',
                status: 'RÉSERVÉ PROJETS + PRÉSIDENT',
                link: 'espace-projets.html'
            },
            'csiv': {
                icon: 'fa-crown',
                title: 'ESPACE CSIV',
                description: 'Cellule Stratégique d\'Innovation et de Veille. Communication, veille, cahiers des charges, rapports et équipe.',
                status: 'RÉSERVÉ PRÉSIDENTE CSIV',
                link: 'espace-csiv.html'
            },
            'secretariat': {
                icon: 'fa-pen-fancy',
                title: 'SECRÉTARIAT',
                description: 'Rédaction et archivage des comptes rendus de réunions et rapports.',
                status: 'ACCÈS RESTREINT',
                link: 'secretariat.html'
            },
            'inventaire': {
                icon: 'fa-boxes',
                title: 'GESTION DES STOCKS',
                description: 'Inventaire complet des composants électroniques.',
                status: 'ACCÈS RESTREINT',
                link: 'inventaire.html'
            },
            'vice-president': {
                icon: 'fa-user-tie',
                title: 'POSTE VICE-PRÉSIDENT',
                description: 'Outils de gestion et supervision de la communauté.',
                status: 'EN DÉVELOPPEMENT',
                link: '#'
            },
            'communication': {
                icon: 'fa-bullhorn',
                title: 'COMMUNICATION',
                description: 'Gestion de la communication et des réseaux sociaux.',
                status: 'EN DÉVELOPPEMENT',
                link: '#'
            },
            'finance': {
                icon: 'fa-coins',
                title: 'FINANCE',
                description: 'Gestion financière et comptabilité de la communauté.',
                status: 'EN DÉVELOPPEMENT',
                link: '#'
            }
        };

        let membreActuel = null;

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 12) + 's';
                const colors = ['#ffd700', '#00f0ff', '#7b2cbf'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = `0 0 10px ${p.style.background}`;
                container.appendChild(p);
            }
        }

        function verifierCode() {
            const code = document.getElementById('accessCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (MEMBRES_DIRECTION[code]) {
                membreActuel = MEMBRES_DIRECTION[code];
                document.getElementById('accessModal').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
                afficherPostes();
            } else {
                errorMsg.textContent = '❌ Code incorrect. Accès refusé.';
                document.getElementById('accessCode').value = '';
                setTimeout(() => errorMsg.textContent = '', 3000);
            }
        }

        function afficherPostes() {
            document.getElementById('userInfo').innerHTML = 
                `<i class="fas fa-user-shield"></i> ${membreActuel.prenom} ${membreActuel.nom} - ${membreActuel.fonction}`;

            const grid = document.getElementById('featuresGrid');
            grid.innerHTML = '';

            membreActuel.postes.forEach(posteKey => {
                const carte = CARTES[posteKey];
                if (!carte) return;

                const div = document.createElement('div');
                div.className = 'feature-card';
                div.onclick = () => {
                    if (carte.link === '#') {
                        alert('🚧 Ce poste est en cours de développement.');
                    } else {
                        window.location.href = carte.link;
                    }
                };
                div.innerHTML = `
                    <div class="feature-icon"><i class="fas ${carte.icon}"></i></div>
                    <h3 class="feature-title">${carte.title}</h3>
                    <p class="feature-description">${carte.description}</p>
                    <div class="feature-status"><i class="fas fa-shield-alt"></i> ${carte.status}</div>
                `;
                grid.appendChild(div);
            });
        }

        document.getElementById('accessCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifierCode();
        });

        createParticles();
    </script>
</body>
</html>
