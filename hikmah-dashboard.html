<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikmah's Club - Dashboard Administration 2026-2027</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #ec4899;
            --accent-light: #f472b6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #06b6d4;
            --violet: #8b5cf6;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --card-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== FONDS ANIMÉS ===== */
        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -3;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 90%, rgba(139, 92, 246, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(6, 182, 212, 0.25) 0%, transparent 50%),
                linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: floatOrb 15s ease-in-out infinite;
            opacity: 0.6;
        }

        .orb-1 { width: 400px; height: 400px; background: #6366f1; top: -150px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -150px; left: -100px; animation-delay: 5s; }
        .orb-3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 40%; animation-delay: 10s; }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -60px) scale(1.15); }
        }

        /* ===== HEADER ===== */
        .glass-header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 10px 40px rgba(236, 72, 153, 0.7); }
        }

        .logo-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            color: white;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text h1 span {
            background: linear-gradient(135deg, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text .year-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(236,72,153,0.3));
            border: 1px solid var(--glass-border);
            color: #c7d2fe;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .admin-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            padding: 8px 20px;
            border-radius: 50px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.6);
        }

        /* ===== NAVIGATION ===== */
        .nav-container {
            max-width: 1600px;
            margin: 25px auto;
            padding: 0 2rem;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-tab {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: #cbd5e1;
            padding: 14px 28px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-3px);
            color: white;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        /* ===== STATS ===== */
        .stats-grid {
            max-width: 1600px;
            margin: 0 auto 30px;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 28px;
            color: white;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.4);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .stat-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            display: block;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            opacity: 0.7;
            font-size: 0.85rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* ===== SEARCH BAR ===== */
        .filters-container {
            max-width: 1600px;
            margin: 0 auto 25px;
            padding: 0 2rem;
        }

        .search-bar {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px 22px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input::placeholder { color: rgba(255,255,255,0.5); }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .filter-btn {
            padding: 10px 22px;
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            background: rgba(255,255,255,0.05);
            color: #cbd5e1;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
        }

        .filter-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: white;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: transparent;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        /* ===== STUDENTS ===== */
        .students-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: white;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            font-family: 'Poppins', sans-serif;
        }

        .add-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6);
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .student-card {
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            padding: 25px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .student-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 6px; height: 100%;
            background: linear-gradient(180deg, #f59e0b, #ef4444);
        }

        .student-card.status-selected::before { background: linear-gradient(180deg, #10b981, #059669); }
        .student-card.status-excluded::before { background: linear-gradient(180deg, #ef4444, #dc2626); }

        .student-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 60px rgba(99, 102, 241, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .student-avatar {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .student-avatar.bourguiba { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .student-avatar.mbao { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }

        .status-badge {
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-badge.selected { background: rgba(16, 185, 129, 0.15); color: #059669; }
        .status-badge.waiting { background: rgba(245, 158, 11, 0.15); color: #d97706; }
        .status-badge.excluded { background: rgba(239, 68, 68, 0.15); color: #dc2626; }

        .student-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .student-class {
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
            color: #6366f1;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-block;
            font-size: 0.85rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 18px 0;
        }

        .info-item .info-label {
            color: #64748b;
            font-size: 0.75rem;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-item .info-value {
            color: #0f172a;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .points-section {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 15px;
            padding: 18px;
            margin: 18px 0;
        }

        .points-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 700;
            color: #334155;
            font-size: 0.9rem;
        }

        .points-bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .points-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.6s ease;
        }

        .points-fill.danger { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .points-fill.warning { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .points-fill.success { background: linear-gradient(90deg, #10b981, #059669); }

        .exclusion-warning {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #dc2626;
            font-weight: 700;
            margin-top: 10px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .card-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-edit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5); }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 2px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover { background: #ef4444; color: white; }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border-radius: 25px;
            padding: 35px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 70px rgba(0,0,0,0.5);
            animation: modalAppear 0.3s ease;
        }

        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 2px solid #f1f5f9;
        }

        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            color: #0f172a;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.3s ease;
            line-height: 1;
        }

        .modal-close:hover { color: #ef4444; transform: rotate(90deg); }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .points-editor {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .points-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .points-btn:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4); }

        .points-display {
            flex: 1;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #6366f1;
            font-family: 'Space Grotesk', sans-serif;
            min-width: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(99, 102, 241, 0.6); }

        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-cancel:hover { background: #e2e8f0; }

        /* ===== SYNC INDICATOR ===== */
        .sync-indicator {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            backdrop-filter: blur(10px);
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .no-results {
            text-align: center;
            padding: 80px 40px;
            color: white;
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 5rem;
            margin-bottom: 25px;
            opacity: 0.3;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .no-results h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .no-results p { opacity: 0.6; }

        .loading-spinner {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3000;
            background: rgba(15, 23, 42, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.5);
            text-align: center;
            display: none;
            border: 1px solid var(--glass-border);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(99, 102, 241, 0.2);
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-spinner p { color: white; font-weight: 600; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 100px 40px;
            color: white;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 6rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.6;
        }

        .empty-state h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .empty-state p {
            opacity: 0.7;
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; }
            .students-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .logo-text h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <header class="glass-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="logo-text">
                    <h1>HIKMAH'S <span>CLUB</span></h1>
                    <div class="year-badge"><i class="fas fa-calendar"></i> ANNÉE 2026-2027</div>
                </div>
            </div>
            <div class="admin-section">
                <div class="admin-profile">
                    <div class="admin-avatar" id="adminInitials">AD</div>
                    <div>
                        <div style="font-weight: 600;" id="adminNameDisplay">Admin</div>
                        <div style="font-size: 0.75rem; opacity: 0.7;" id="adminEmailDisplay">admin@hikmah.com</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </div>
    </header>

    <div class="nav-container">
        <button class="nav-tab active" data-school="all" onclick="switchSchool('all')">
            <i class="fas fa-globe"></i> Tous les Élèves
        </button>
        <button class="nav-tab" data-school="bourguiba" onclick="switchSchool('bourguiba')">
            <i class="fas fa-school"></i> Bourguiba
        </button>
        <button class="nav-tab" data-school="mbao" onclick="switchSchool('mbao')">
            <i class="fas fa-school"></i> Mbao
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-icon">👥</span>
            <div class="stat-value" id="totalStudents">0</div>
            <div class="stat-label">Total Élèves</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">✅</span>
            <div class="stat-value" id="selectedStudents">0</div>
            <div class="stat-label">Sélectionnés</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">⏳</span>
            <div class="stat-value" id="waitingStudents">0</div>
            <div class="stat-label">En Attente</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon">🚫</span>
            <div class="stat-value" id="excludedStudents">0</div>
            <div class="stat-label">Exclus (≤25 pts)</div>
        </div>
    </div>

    <div class="filters-container">
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Rechercher par nom, prénom, classe ou club..." oninput="filterStudents()">
            <div class="filter-group" id="classFilters">
                <button class="filter-btn active" data-filter="all" onclick="applyFilter('class', 'all', this)">📚 Toutes</button>
                <button class="filter-btn" data-filter="6éme" onclick="applyFilter('class', '6éme', this)">6éme</button>
                <button class="filter-btn" data-filter="5éme" onclick="applyFilter('class', '5éme', this)">5éme</button>
                <button class="filter-btn" data-filter="4éme" onclick="applyFilter('class', '4éme', this)">4éme</button>
                <button class="filter-btn" data-filter="2nde" onclick="applyFilter('class', '2nde', this)">2nde</button>
                <button class="filter-btn" data-filter="1ére" onclick="applyFilter('class', '1ére', this)">1ére</button>
                <button class="filter-btn" data-filter="TL2" onclick="applyFilter('class', 'TL2', this)">TL2</button>
                <button class="filter-btn" data-filter="TS2" onclick="applyFilter('class', 'TS2', this)">TS2</button>
            </div>
        </div>
    </div>

    <div class="students-container">
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">👥 Tous les Élèves</h2>
            <button class="add-btn" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Ajouter un Élève
            </button>
        </div>
        <div class="students-grid" id="studentsGrid"></div>
    </div>

    <!-- Modal Modification -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Modifier l'Élève</h3>
                <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Élève</label>
                <input type="text" id="editStudentName" readonly>
            </div>
            <div class="form-group">
                <label>Points Actuels</label>
                <div class="points-editor">
                    <button class="points-btn" onclick="changePoints(-10)">-10</button>
                    <button class="points-btn" onclick="changePoints(-5)">-5</button>
                    <button class="points-btn" onclick="changePoints(-1)">-1</button>
                    <div class="points-display" id="editPoints">0</div>
                    <button class="points-btn" onclick="changePoints(1)">+1</button>
                    <button class="points-btn" onclick="changePoints(5)">+5</button>
                    <button class="points-btn" onclick="changePoints(10)">+10</button>
                </div>
            </div>
            <div class="form-group">
                <label>Nombre d'Absences</label>
                <input type="number" id="editAbsences" value="0" min="0" style="text-align: center; font-size: 1.2rem;">
            </div>
            <div class="form-group">
                <label>Statut</label>
                <select id="editStatus">
                    <option value="Sélectionné">Sélectionné</option>
                    <option value="En attente">En attente</option>
                    <option value="Exclu">Exclu</option>
                </select>
            </div>
            <div class="form-group">
                <label>Code Administrateur</label>
                <input type="password" id="editAdminCode" placeholder="Code requis">
                <div id="codeError" style="color: #ef4444; font-size: 0.9rem; margin-top: 5px; display: none;">
                    ⚠️ Code incorrect
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeModal('editModal')">Annuler</button>
                <button class="modal-btn btn-primary" onclick="saveStudentChanges()">
                    <i class="fas fa-save"></i> Sauvegarder
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Ajout -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">➕ Nouvel Élève</h3>
                <button class="modal-close" onclick="closeModal('addModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>École</label>
                <select id="addSchool">
                    <option value="bourguiba">Bourguiba</option>
                    <option value="mbao">Mbao</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="addNom" placeholder="Nom de famille">
            </div>
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" id="addPrenom" placeholder="Prénom">
            </div>
            <div class="form-group">
                <label>Classe</label>
                <select id="addClasse">
                    <option value="">Sélectionner</option>
                    <option value="6éme">6éme</option>
                    <option value="5éme">5éme</option>
                    <option value="4éme">4éme</option>
                    <option value="2nde">2nde</option>
                    <option value="1ére">1ére</option>
                    <option value="TL2">TL2</option>
                    <option value="TS2">TS2</option>
                </select>
            </div>
            <div class="form-group">
                <label>Club</label>
                <select id="addClub">
                    <option value="">Sélectionner</option>
                    <option value="Informatique-Robotique">Informatique-Robotique</option>
                    <option value="Anglais">Anglais</option>
                    <option value="Arabe">Arabe</option>
                    <option value="Physique">Physique</option>
                    <option value="Biochimie">Biochimie</option>
                    <option value="CLAP">CLAP</option>
                    <option value="Sport">Sport</option>
                </select>
            </div>
            <div class="form-group">
                <label>Statut</label>
                <select id="addStatus">
                    <option value="Sélectionné">Sélectionné</option>
                    <option value="En attente">En attente</option>
                    <option value="Exclu">Exclu</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeModal('addModal')">Annuler</button>
                <button class="modal-btn btn-primary" onclick="addStudent()">
                    <i class="fas fa-plus"></i> Ajouter
                </button>
            </div>
        </div>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>

    <div class="sync-indicator" id="syncStatus">
        <i class="fas fa-cloud"></i> Synchronisé Supabase
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============ CONFIGURATION ============
        const ADMIN_CODE = "194019602026";
        const EXCLUSION_THRESHOLD = 25;
        const ANNEE_SCOLAIRE = "2026-2027";

        const SUPABASE_URL = 'https://olgrpycxudzuxtzjxoma.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ3JweWN4dWR6dXh0emp4b21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA4MDUsImV4cCI6MjEwNTkwNjgwNX0.Day-sMRM-l6bBWuqCsho6vBPCKNxZaqUB1TgHbF6-TE';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============ ÉTAT GLOBAL ============
        let allStudents = [];
        let currentSchool = 'all';
        let currentClassFilter = 'all';
        let currentEditStudent = null;
        let editingPoints = 0;
        let editingAbsences = 0;

        // ============ INITIALISATION ============
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Démarrage Dashboard Hikmah 2026-2027...');
            showLoading(true);
            loadAdminInfo();
            await loadStudents();
            renderAll();
            updateStats();
            showLoading(false);
            updateSyncStatus(true);
            console.log(`✅ Dashboard prêt - ${allStudents.length} élèves`);
        });

        // ============ GESTION ADMIN ============
        function loadAdminInfo() {
            const saved = localStorage.getItem('hikmah_admin');
            if (!saved) {
                const email = prompt('Email administrateur:');
                if (!email) {
                    alert('Email requis pour accéder au dashboard');
                    return;
                }
                const admin = { email: email, name: email.split('@')[0] };
                localStorage.setItem('hikmah_admin', JSON.stringify(admin));
                displayAdminInfo(admin);
            } else {
                displayAdminInfo(JSON.parse(saved));
            }
        }

        function displayAdminInfo(admin) {
            document.getElementById('adminInitials').textContent = admin.name.substring(0, 2).toUpperCase();
            document.getElementById('adminNameDisplay').textContent = admin.name;
            document.getElementById('adminEmailDisplay').textContent = admin.email;
        }

        function logout() {
            if (confirm('Se déconnecter ?')) {
                localStorage.removeItem('hikmah_admin');
                window.location.reload();
            }
        }

        // ============ CHARGEMENT SUPABASE ============
        async function loadStudents() {
            try {
                const { data, error } = await supabaseClient
                    .from('hikmah_eleves')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                allStudents = data || [];
                console.log(`☁️ ${allStudents.length} élèves chargés depuis Supabase`);
            } catch (e) {
                console.error('❌ Erreur Supabase:', e.message);
                allStudents = [];
                updateSyncStatus(false);
            }
        }

        // ============ SAUVEGARDE SUPABASE ============
        async function saveStudent(student) {
            try {
                const { data, error } = await supabaseClient
                    .from('hikmah_eleves')
                    .insert([{
                        nom: student.nom,
                        prenom: student.prenom,
                        classe: student.classe,
                        club: student.club,
                        statut: student.statut,
                        points: student.points,
                        absences: student.absences || 0,
                        ecole: student.ecole,
                        mandat: ANNEE_SCOLAIRE,
                        timestamp: Date.now()
                    }])
                    .select();

                if (error) throw error;
                updateSyncStatus(true);
                return data[0];
            } catch (e) {
                console.error('❌ Erreur insert:', e.message);
                updateSyncStatus(false);
                throw e;
            }
        }

        async function updateStudentSupabase(student) {
            try {
                const { error } = await supabaseClient
                    .from('hikmah_eleves')
                    .update({
                        nom: student.nom,
                        prenom: student.prenom,
                        classe: student.classe,
                        club: student.club,
                        statut: student.statut,
                        points: student.points,
                        absences: student.absences || 0,
                        ecole: student.ecole,
                        mandat: ANNEE_SCOLAIRE
                    })
                    .eq('id', student.id);

                if (error) throw error;
                updateSyncStatus(true);
            } catch (e) {
                console.error('❌ Erreur update:', e.message);
                updateSyncStatus(false);
                throw e;
            }
        }

        async function deleteStudentSupabase(id) {
            try {
                const { error } = await supabaseClient
                    .from('hikmah_eleves')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                updateSyncStatus(true);
            } catch (e) {
                console.error('❌ Erreur delete:', e.message);
                updateSyncStatus(false);
                throw e;
            }
        }

        function updateSyncStatus(synced) {
            const status = document.getElementById('syncStatus');
            if (synced) {
                status.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Synchronisé Supabase';
                status.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            } else {
                status.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erreur Supabase';
                status.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
            }
        }

        // ============ RENDU ============
        function renderAll() {
            let students = getFilteredStudents();

            if (allStudents.length === 0) {
                document.getElementById('studentsGrid').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-graduation-cap"></i>
                        <h2>Nouvelle Année Scolaire 2026-2027</h2>
                        <p>Aucun élève enregistré pour le moment. Commencez par ajouter les nouveaux élèves du club.</p>
                        <button class="add-btn" onclick="openAddModal()" style="padding: 16px 40px; font-size: 1.05rem;">
                            <i class="fas fa-plus"></i> Ajouter le premier élève
                        </button>
                    </div>
                `;
            } else if (students.length === 0) {
                document.getElementById('studentsGrid').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>Aucun élève trouvé</h3>
                        <p>Ajustez vos filtres de recherche</p>
                    </div>
                `;
            } else {
                document.getElementById('studentsGrid').innerHTML = students.map(s => createStudentCard(s)).join('');
            }

            updateStats();
        }

        function createStudentCard(student) {
            const fullName = `${student.prenom} ${student.nom}`;
            const initials = fullName.split(' ').map(n => n[0] || '').join('').toUpperCase().substring(0, 2);
            const isExcluded = student.points <= EXCLUSION_THRESHOLD;
            const statusClass = isExcluded ? 'status-excluded' : 
                               student.statut === 'Sélectionné' ? 'status-selected' : 'status-waiting';
            const statusBadgeClass = isExcluded ? 'excluded' : 
                                    student.statut === 'Sélectionné' ? 'selected' : 'waiting';
            const statusText = isExcluded ? 'EXCLU' : student.statut;
            const pointsColor = student.points <= EXCLUSION_THRESHOLD ? 'danger' : 
                               student.points <= 50 ? 'warning' : 'success';

            return `
                <div class="student-card ${statusClass}">
                    <div class="card-header">
                        <div class="student-avatar ${student.ecole}">${initials}</div>
                        <span class="status-badge ${statusBadgeClass}">${statusText}</span>
                    </div>

                    <h3 class="student-name">${fullName}</h3>
                    <div class="student-class">📚 ${student.classe}</div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Club</div>
                            <div class="info-value">${student.club}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Absences</div>
                            <div class="info-value">${student.absences || 0} jour(s)</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Mandat</div>
                            <div class="info-value">${student.mandat || ANNEE_SCOLAIRE}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">École</div>
                            <div class="info-value">${student.ecole === 'bourguiba' ? '🏫 Bourguiba' : '🏫 Mbao'}</div>
                        </div>
                    </div>

                    <div class="points-section">
                        <div class="points-header">
                            <span>Points</span>
                            <span style="color: ${student.points <= EXCLUSION_THRESHOLD ? '#ef4444' : '#10b981'}">
                                ${student.points}/100
                            </span>
                        </div>
                        <div class="points-bar">
                            <div class="points-fill ${pointsColor}" style="width: ${student.points}%"></div>
                        </div>
                        ${isExcluded ? 
                            `<div class="exclusion-warning">
                                ⚠️ EXCLU - ${student.points} points (seuil: ${EXCLUSION_THRESHOLD})
                            </div>` : ''
                        }
                    </div>

                    <div class="card-actions">
                        <button class="card-btn btn-edit" onclick="openEditModal(${student.id})">
                            <i class="fas fa-edit"></i> Modifier
                        </button>
                        <button class="card-btn btn-delete" onclick="deleteStudent(${student.id})">
                            <i class="fas fa-trash"></i> Supprimer
                        </button>
                    </div>
                </div>
            `;
        }

        // ============ FILTRES ============
        function getFilteredStudents() {
            let students = [...allStudents];

            if (currentSchool !== 'all') {
                students = students.filter(s => s.ecole === currentSchool);
            }

            if (currentClassFilter !== 'all') {
                students = students.filter(s => s.classe && s.classe.toString().includes(currentClassFilter));
            }

            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (searchTerm) {
                students = students.filter(s => 
                    (s.nom && s.nom.toLowerCase().includes(searchTerm)) ||
                    (s.prenom && s.prenom.toLowerCase().includes(searchTerm)) ||
                    (s.classe && s.classe.toString().toLowerCase().includes(searchTerm)) ||
                    (s.club && s.club.toLowerCase().includes(searchTerm))
                );
            }

            return students;
        }

        function filterStudents() { renderAll(); }

        function applyFilter(type, value, btn) {
            if (type === 'class') {
                currentClassFilter = value;
                document.querySelectorAll('#classFilters .filter-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
            }
            renderAll();
        }

        function switchSchool(school) {
            currentSchool = school;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.school === school);
            });

            const titles = {
                'all': '👥 Tous les Élèves',
                'bourguiba': '🏫 École Bourguiba',
                'mbao': '🏫 École Mbao'
            };
            document.getElementById('sectionTitle').textContent = titles[school] || '👥 Tous les Élèves';

            renderAll();
        }

        // ============ STATISTIQUES ============
        function updateStats() {
            const students = getFilteredStudents();
            document.getElementById('totalStudents').textContent = students.length;
            document.getElementById('selectedStudents').textContent = students.filter(s => s.statut === 'Sélectionné' && s.points > EXCLUSION_THRESHOLD).length;
            document.getElementById('waitingStudents').textContent = students.filter(s => s.statut === 'En attente' && s.points > EXCLUSION_THRESHOLD).length;
            document.getElementById('excludedStudents').textContent = students.filter(s => s.points <= EXCLUSION_THRESHOLD).length;
        }

        // ============ MODIFICATION ÉLÈVE ============
        function openEditModal(studentId) {
            currentEditStudent = allStudents.find(s => s.id === studentId);
            if (!currentEditStudent) return;

            editingPoints = currentEditStudent.points;
            editingAbsences = currentEditStudent.absences || 0;

            document.getElementById('editStudentName').value = `${currentEditStudent.prenom} ${currentEditStudent.nom}`;
            document.getElementById('editPoints').textContent = editingPoints;
            document.getElementById('editAbsences').value = editingAbsences;
            document.getElementById('editStatus').value = currentEditStudent.statut;
            document.getElementById('editAdminCode').value = '';
            document.getElementById('codeError').style.display = 'none';

            document.getElementById('editModal').style.display = 'flex';
        }

        function changePoints(amount) {
            editingPoints = Math.max(0, Math.min(100, editingPoints + amount));
            document.getElementById('editPoints').textContent = editingPoints;
        }

        async function saveStudentChanges() {
            const adminCode = document.getElementById('editAdminCode').value;

            if (adminCode !== ADMIN_CODE) {
                document.getElementById('codeError').style.display = 'block';
                return;
            }

            if (!currentEditStudent) return;

            showLoading(true);

            editingAbsences = parseInt(document.getElementById('editAbsences').value) || 0;
            if (editingAbsences < 0) editingAbsences = 0;

            currentEditStudent.points = editingPoints;
            currentEditStudent.absences = editingAbsences;
            currentEditStudent.statut = document.getElementById('editStatus').value;

            if (editingPoints <= EXCLUSION_THRESHOLD) {
                currentEditStudent.statut = 'Exclu';
            }

            try {
                await updateStudentSupabase(currentEditStudent);
                closeModal('editModal');
                renderAll();
                alert(`✅ Élève mis à jour !\nPoints: ${editingPoints}\nAbsences: ${editingAbsences}\nStatut: ${currentEditStudent.statut}`);
            } catch (e) {
                alert('❌ Erreur de sauvegarde : ' + e.message);
            }
            showLoading(false);
        }

        // ============ AJOUT ÉLÈVE ============
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        async function addStudent() {
            const school = document.getElementById('addSchool').value;
            const nom = document.getElementById('addNom').value.trim();
            const prenom = document.getElementById('addPrenom').value.trim();
            const classe = document.getElementById('addClasse').value;
            const club = document.getElementById('addClub').value;
            const status = document.getElementById('addStatus').value;

            if (!nom || !prenom || !classe || !club) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            showLoading(true);

            const newStudent = {
                nom,
                prenom,
                classe,
                club,
                statut: status,
                points: 100,
                absences: 0,
                ecole: school,
                mandat: ANNEE_SCOLAIRE
            };

            try {
                const saved = await saveStudent(newStudent);
                allStudents.push(saved);
                closeModal('addModal');
                renderAll();

                document.getElementById('addNom').value = '';
                document.getElementById('addPrenom').value = '';
                document.getElementById('addClasse').value = '';
                document.getElementById('addClub').value = '';

                alert('✅ Élève ajouté avec succès !');
            } catch (e) {
                alert('❌ Erreur : ' + e.message);
            }
            showLoading(false);
        }

        // ============ SUPPRESSION ÉLÈVE ============
        async function deleteStudent(studentId) {
            const code = prompt('🔐 Code administrateur pour supprimer:');

            if (code !== ADMIN_CODE) {
                alert('❌ Code incorrect.');
                return;
            }

            if (!confirm('⚠️ Supprimer définitivement cet élève ?')) return;

            showLoading(true);
            try {
                await deleteStudentSupabase(studentId);
                allStudents = allStudents.filter(s => s.id !== studentId);
                renderAll();
                alert('✅ Élève supprimé');
            } catch (e) {
                alert('❌ Erreur : ' + e.message);
            }
            showLoading(false);
        }

        // ============ UTILITAIRES ============
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }

        window.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.style.display = 'none';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            }
        });
    </script>
</body>
</html>
